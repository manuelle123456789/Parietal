Artikularis inferiores weisen nach ventral/caudal\n- Ca. 40-50° schräggestellt\n- Zur BWS zunehmend nach lateral geneigt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"HWS-24","slot":"HWS","nr":24,"frage":"Beschreibe „Blockwirbel“. Wo kommen Blockbildungen am häufigsten vor?","antwort":"- Als Blockwirbel wird die teilweise oder ganze Verschmelzung (Fusion) zweier oder mehrerer Wirbelkörper bezeichnet\n- Die Verschmelzung kann durch eine Entwicklungsstörung bedingt (dysontogenetischer Blockwirbel) oder im Laufe des Lebens\nerworben sein\n- dysontogenetische Blockwirbelbildung findet sich zum Beispiel beim Klippel-Feil-Syndrom\n- Erworbene Blockwirbel à nach Entzündungen der Wirbel und Bandscheiben (z. B. nach Tuberkulose), nach Trauma oder bei\nausgeprägter Degeneration der Bandscheiben und angrenzenden Wirbel (Osteochondrosis intervertebralis) ausbilden","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"HWS-25","slot":"HWS","nr":25,"frage":"Benenne/beschreibe die Dysfunktionsmodelle nach Fryette von C2-3 bis C6-7!","antwort":"- Erstes Gesetz\n➢ In neutraler Position wird ein Wirbel bei einer Seitneigung in eine Richtung in die andere Richtung rotieren\n➢ Z.B. Seitneigung links lässt der Wirbel nach rechts rotieren\n \n- Zweites Gesetz\n➢ Wenn ein Wirbel sich in einer Flexion oder Extension befindet, wird die Rotation in die gleiche Richtung wie die\nSeitneigung erfolgen.\n➢ Z.B. In Flexion wird eine Rotation rechts verbunden sein mit einer Seitneigung rechts\n \n- Drittes Gesetz\n➢ In einem Wirbelsegment wird jede Bewegung in einer Ebene die Bewegungen in den anderen Ebenen\nbeeinflussen\n➢ Z.B. In Extension vermindert sich die Rotation und Lateralflexion eines Wirbels.\n- V on C2-C7 gilt nur das","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"HWS-26","slot":"HWS","nr":26,"frage":"Welche Auffälligkeiten kann man merken/spüren/mitbekommen bei der Palpation der HWS/ C2-3 bis C6-7?","antwort":"- Dornfortsatz C2:\n➢ erste prominente ossäre Struktur unterhalb des Okziputs\n- Differenzierung Dornfortsätze C6-C7 à passive geführte Flexion und Extension. à bei der Rückbewegung verschwindet der\nDornfortsatz von C6 und C7 ist prominent\n- Der","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"HWS-27","slot":"HWS","nr":27,"frage":"Welche Auffälligkeiten kann man merken/spüren/mitbekommen bei einer arthrokinematischen Untersuchung der HWS/C2-3 bis C6-7?","antwort":"C6-7\n- Elastisch (Norm) oder Resistent?\n- Art der Resistenz? Hart-fest-elastisch, Mauer, Blockade\n- Schmerz? lokal, ausstrahlend?\n- Muskuläre Anspannung, Gegenspannung\n- Neurovegetativ, schwitzen, wärme/kälte","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"HWS-28","slot":"HWS","nr":28,"frage":"Beschreibe die systematische Untersuchung der HWS/C2-3 bis C6-7!","antwort":"1. Anamnese\n2. Inspektion\n3. Palpation\n4. Tests\n4.1 Provokationstests\n4.2 Osteokinematische Tests\n4.3 Arthrokinematische Tests\n5. Techniken","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"HWS-29","slot":"HWS","nr":29,"frage":"Welche Kontraindikationen kennst du für eine arthrokinematische, rotatorisch betonte Behandlung der HWS/C2-3 bis C6-7?","antwort":"- Starke Osteoporose\n- Akute Entzündungen\n- Posttraumatisch (ungeklärt)\n- Verknöcherungen, Fibrosierung","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"HWS-30","slot":"HWS","nr":30,"frage":"Beschreibe, benenne oder erkläre: - Vertebra prominens - Drittelregel nach Steel - Articulatio atlanto-occipitalis - Articulatio atlanto-axialis lateralis - das Uncovertebralgelenk - Membrana atlanto-occipitalis post. -L i g .nuchae - Lig. cruciforme atlantis - Ligamenta alaria - M. longus colli -Cupulap leura - Supra- & infrahyale Muskulatur - Ganglion cervicothoracicum (cervicale inferius/stellatum - Circulus arteriosus cerebri - Rami dorsalis von C1, C2, C3 - Punctum nervosum - das spino-transversale Muskelsystem - die Scalenuslücken","antwort":"Beschreibe: • Vertebra Prominense: C7, da er in der Sagitalebene in der WS etwas vorspringt, Proc. Spinosus (häufig) am prominentesten, Facettenebene HWS oben, BWS unten • Drittelregel nach Steel: räumliche Verhältnisse zwischen Atlas & Dens axis und dem RM, sowie der freien Zone müssen konstant sein, 1/3 Dens, 1/3 RM, 1/3 freie Zone (Sicherheits-& Schutzzone wegen Kreislauf- & Atemzentrum in Medulla Oblongata) • Art. Atlanto-occipitalis: Condyli occipitalis (convex) & Fovea articularis superior des Atlas (concav), längsovale Gelenkflächen, können aus mehreren Teilen bestehen • Art. Atlanto-axialis lateralis: paariges Gelenk aus Gelenkflächen der Proc. Articulares von Atlas & Axis • Uncovertebralgelenke: Deckplatten der HWK erhalten durch ihre konkave Form & die Bandscheiben seitliche Verschmälerungen, Leitschienen für Flex, Ext, Stabilität für LAtFlex Sobald Banscheibe schmaler wird, kommt es zu Kontakt zwischen Proc. Uncinatus & lat. Rand der Grundplatte des cranialen Nachbarwirbels -> mechanische Reizung führt zu Nearthrosen • Membrana-athlanto-occipitalis posterior: von Occiput bis Atlas, wird + Membrana altanto-axialis posterior zu Lig. Flavum • Lig. Nuchae: Band aus elastischem BG im Bereich der HWS, weiter caudal als Lig. Suprespinale U: Protuberantia occipitalis externa, Linea Nuchae mediana, A: Proc. Spinosus C7 Bildet Ursrung für M. Trapezius & oberen Fasern des M. Rhomboiden Minor • Lig. Cruciforme atlantis: stabilisiert die Kopfgelenke, = Lig. Transversum atlantis + Fasciculus Longitudinales • Ligg. Alaria: kurze, derbe Bänder, atlante Portion: Verbindung Dens mit Massae lateralis atlantis, occipitalie Portion: Verbindung Dens mit Condylus occipitalis • M. Longus colli: verbindet bogenförmig C2-5 WK, mit WK von unterer HWS und oberer BWS, preavertebrale Muskeln, manche Fasern laufen von WK zu Querfortsätzen mit Proc. Transversus von C6 als Mittelpunkt • Cupula pleura = Pleurakuppel: ist der am weitesten cranial gelegene Bereich des Brustfells (Pleura), der über den Oberrand der 1. Rippe ragt, Pleurakuppel wird vollständig von der Lungenspitze ausgefüllt (2cm cranial der Clavicula) , von außen von Mm. Scaleni eingefasst, mit Lamina praevertebralis verbunden, Lig. Transversopleurea, Lig. Vertebropleurea, Lig. Costopleurae, Lig. Oesophagopleurae, Lig, vasopleurae, Lig. Tracheopleurae • Supra- & Infrahyale Muskulatur Infrahyale Mm: setzt von caudal am Zungenbein an, ist unter dem Os hyoideum, zieht Zungenbein nach unten und fixiert es und unterstützt Schluckakt, M. Omohyoideus hält V. Jugularis interna offen -> M. Omohyoideus, M. Sternohyoideus, M. Sternothyroideus, M. Thyrohyoideus Suprahyale Mm: setzt von cranial kommend am Zungenbein an, liegt darüber, bildet muskuläre Grundlage von Mundboden, unterstützt Kieferöffnung, Schluckakt, fixiert Zungenbein -> M. Digastricus, M. Mylohyoideus, M. Geniohyoideus, M. Stylohyoideus • Ganglion cervicothoracicum (cervicalis inferius/ stellatum) = untere Ganglion des Halses des Grenzstranges (Sympathikus), oberhalb der Pleurakuppel zwischen Proc. Transversus C7 & Caput der 1. Rippe, Ganglion cervicalis inferiore und das erste Brustganglion verschmelzen zum größeren Ganglion stellatum, hiervon gehen sympathische Fasern zur Kopf, Hals, Arm, Herz & Lunge Läsionen: Horner-Sydrom, Ausfall des Halssympathikus: Pupillenverengung (Miosis), Herabhängen des Oberlids (Ptosis), Zurücksinken des Augapfels in Augenhöhle (Endophthalmus) • circulus arteriosus cerebri = Circulus arteriosus willisii = arterieller Gefäßring an Gehrinbasis","stern":false,"pruefen":false,"neu":false,"quelle":"Antworten Parietale Abschlussprüfung","kopf":"Beschreibe, benenne oder erkläre","items":[{"b":"Vertebra prominens","a":"Halswirbel entspricht nicht immer der Vertebra prominen à C6 kann auch prominenter sein\n- Die kranialen Gelenkflächen des C7 sind noch relativ flach gestellt, die kaudalen Gelenkflächen haben bereits die Steilstellung der\nBustwirbelkörper. Deshalb gleiten bei maximaler Extension der HWS alle Dornfort-sätze in die Tiefe, mit Ausnahme des"},{"b":"Drittelregel nach Steel","a":"- Räumliche Verhältnisse zwischen knöchernen Strukturen (Atlas + Densaxis), RM + freie Zone =\nanatomische Konstante\n- 1/3 = Dens, 1/3 = RM, 1/3 =sicherheits- /Schutzzone für RM à Sicherung erfolgt über Ligg. Alaria +\nLig. Transversum atlantis"},{"b":"Articulatio atlanto-occipitalis","a":"- Occiput = 2 bikonvexe Gelenkflächen \ngute Passform\n- Atlas = 2 bikonkave Gelenkflächen\n- C0/C1 hat dicke Knorpelschicht à gute Pufferung\n- Keine BS à Bänder + Mm müssen Funktion übernehmen à Kräfte aufnehmen + weiterleiten, Verteilung Kräfte, ermöglicht\n+ limitiert Flex/Ext/ROT\n- C0/C1 hat monosegmentale Muskulatur\n- C0/C1 hat straffen Kapselbandapperat (ligg. Anulare)"},{"b":"Articulatio atlanto-axialis lateralis","a":"- Fovea articularis inferior des Atlas leicht konvexer bis flacher Gelenkverlauf\n- Fovea articularis superior des Axis nach dorsal-lateral geneigt und konvex, die Gelenkflächen sind leicht inkongruent (kein\nDiscus) à Bikonvexes Gelenk (viel Rotation)"},{"b":"das Uncovertebralgelenk","a":"- WK haben seitliche Randleisten mit segmentalen Unkokovertebral-Gelenk\n- Deckplatten erhalten durch konkave Form + durch BS ihre seitliche Verschmälung\n- Knöcherne Leisten wirken zusammen mit Bogengelenken wie Leizschiene für Bewegung à sorgen für Stabilität"},{"b":"Membrana atlanto-occipitalis post. -L i g .nuchae","a":"- Entspringt hinter Foramen magnum à hinterer Atlasbogen\n- Bestandteil des Lig. Flavum zusammen mit Membrana atlanto-axialis posterior\n- Einziger Punkt, wo willkürliche Mm über Lig. Flava im Kontakt stehen mit Dura (C0/C1)"},{"b":"Lig. cruciforme atlantis","a":"- Stabilisiert Kopfgelenke\n- Zwei Anteile:\n- lig. Transversum atlantis (quer)\nà Kurzes krfätiges Band à spannt sich im Knochenring des Atlas aus +\nhält den Dens axis in Position und verbindet sich geflechtartig\nmiteinader\n- Fasciculi longitudinales (hoch)\nà Foramen Magnum – dosale Fläche"},{"b":"Ligamenta alaria","a":"- Rückseite Dens zum Foramen magnum (seitlich) schräg nach oben (paarig)\n- V .a. Brems- und Haltefunktion, begrenzt Flex + axiale Rot"},{"b":"M. longus colli -Cupulap leura","a":"- Verbindet bogenförmig 2.-5. HWK mit dem Körper der unteren Hals/ oberen Brustwirbeln\n- Teilweise auch zu QF mit HWK QF 6 als Mittelpunkt"},{"b":"Supra- & infrahyale Muskulatur","a":"Infrahyoidale Muskulatur von caudal kommend amZungenbein ansetzend Suprahyoidale Muskulatur von cranial kommend am Hyoideumansetzend\n➢ M. omohyoideus\n➢ M. sternohyoideus\n➢ M. sternothyroideus\n➢ M. thyrohyoideus\n➢ (M. levator glandulae thyroideus à inkonstant)\n- Funktion:\n- Zieht Hyoideum nach unten + fixiert es\n- Unterstützt Schluckakt\n- M. omohyoideus spannt mit Zwischensehne\nHalsfascie à hält V . jugularis interna offen\n- Innervation:\n- C1-C3 (Ansa cervicalis profunda aus Plexus\ncervikales)\nBildet muskuläre Grundlage des Mundbodens\n➢ M. digastricus\n➢ M. mylohyoideus\n➢ M. genohyoideus\n➢ M. stylohyoideus\n- Funktion:\n- Unterstützt Kieferöffnung\n- Unterstützt Schluckakt\n- Fixiert + hebt Zungenbein und zieht es nach vorne\n- Innervation:\n- Plexus cervikales\n- N. mandibulares\n- N. facialis"},{"b":"Ganglion cervicothoracicum (cervicale inferius/stellatum","a":"- Entsteht durch Verschmelzung des Ganglion cervicale inferius mit"},{"b":"Circulus arteriosus cerebri","a":"- Arterieller Gefäßring aus der Gehirnbasis\n- V on ant. nach post.:\n- A. communicans anterior\n- A. cerebri ant (li + re)\n- A. carotis interna (li+re) à A. cerebri media\n- A. communicans posterior\n- A. cerebri post (li+re) aus A. Basilaris\n- Sehr variantenreich v.a. bei Anastomosen der communicans anterior\n- Fkt: Kollateralkreislauf à soll bei Verschluss einer beteiligten Arterie gewisse DB des Gehirns aufrecht erhalten"},{"b":"Rami dorsalis von C1, C2, C3","a":"Welche Rami (Äste) entstehen aus den thorakalen Spinalnerven?\n- Auf jedem Foramen intervertebrale tritt 1 Spinalnerv aus – daraus entsteht jeweils ein:\n1) Ramus dorsalis, Ramus medialis und Ramus lateralis für authochtone Rückenmuskulatur + Haut\n2) Ramus ventralis für Innervation der übrigen somatischen Mm + haut von Rumpf + Extremitäten\n3) Rami communicantes grisei/albi = Verbindung zum Truncus sympathikus\n4) Ramus menigeus = sensulber Zweig der i.d. Wirbelkanal zurückkehrt und versorgt die Meningen"},{"b":"Punctum nervosum","a":"- Wichtiger topographischer Bezugspunkt, liegt am Hinterrand des M. Sternocleido\n- Sensible Nervenäste treten am Hinterrand des M. sternocleido aus, im oberen Teil des seitlichen Halsareals\n- Inhalt: N. occipitalis minor, N. transersus colli, N. auricularis magnus, Nn. supraclavicularis à Ohne Tussi Alles Scheiße"},{"b":"das spino-transversale Muskelsystem","a":"- Das spinotransversale Muskelsystem (nur an der oberen BWS und HWS) besteht aus dem Mm. Splenii cervicalis und\ncapitis\n- Sie ziehen von Procc. Spinosi zu Procc. Transversari höherer Wirbel (mm. Splenii cervicalis) oder zum Proc. Mastoideus\ndes Os temporale sowie zur Linea nuchalis superior des Os occipitale (Mm. Splenii capitits)\n- Diese Muskeln werden aus den Rückenästen (rami posteriores bzw. dorsales) der Spinalnerven innerviert"},{"b":"die Scalenuslücken","a":"- Dorsale Scalenuslücke zwischen M. scalenus anterior und M. scalenus medius; Durchtritt:\n➢ Plexus brachialis, A. subclavia\n- Ventrale Scalenuslücke zwischen dem M. scalenus anterior und dem M. sternocleidomastoideus\n➢ V . subclavia\nHüftgelenk"}]},{"id":"Hüfte-01","slot":"Hüfte","nr":1,"frage":"Nenne die Gelenkpartner des Hüftgelenkes","antwort":"Was für eine Art von Gelenk (Gelenktyp) ist das Hüftgelenk?\n• Nussgelenk (= spezielles Kugelgelenk, bei dem die Pfanne mehr als die Hälfte des Kopfes bedeckt)\n• Gelenkpartner: caput ossis femoris und Acetabulum\n• Caput femoris:\n➢ Kugelförmig, d=4-5 cm\n➢ Nach oben-innen-vorne gerichtet\n➢ Mit Ausnahme der Fovea capitis (Anheftung des Lig. Capitis femoris) mit Knorpel bedeckt\n• Acetabulum:\n➢ Nach außen-vorne-unten gerichtet\n➢ Halbkugelförmige Depression, die von Darm-/Sitz- und Schambein gebildet wird\n➢ Facies lunata (sichelförmige knorpelüberzogene Gelenkfläche)\n➢ Fossa acetabuli (tiefere, von der Facies lunata umfasster Teil)\n➢ Incisura acetabuli (öffnet Acetabulum nach unten und begrenzt so das Foramen obturatum)\n➢ Labrum acetabuli (faserknorpeliger und bindegewebiger Ring zur Ergänzung des knöchernen Acetabulums)\n➢ Lig. Transversum acetabuli (überzieht die Incisura acetabuli)\n• Funktion des HG:\n➢ Statik (trägt Körpergewicht)\n➢ Dynamisch (ermöglicht Bewegung)\n➢ Mobiles und stabiles Gelenk\n• Hüftstabilität durch:\n➢ Gelenkform (Nussgelenk, hohe Kongruenz)\n➢ Bänder (stärkste Bänder des Körpers)\n➢ Muskulatur\n➢ Statik/Kraftverteilung ins Gelenk","stern":false,"pruefen":true,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-02","slot":"Hüfte","nr":2,"frage":"Beschreibe das Acetabulum im Detail","antwort":"Was für eine Art von Gelenk (Gelenktyp) ist das Hüftgelenk?\n• Nussgelenk (= spezielles Kugelgelenk, bei dem die Pfanne mehr als die Hälfte des Kopfes bedeckt)\n• Gelenkpartner: caput ossis femoris und Acetabulum\n• Caput femoris:\n➢ Kugelförmig, d=4-5 cm\n➢ Nach oben-innen-vorne gerichtet\n➢ Mit Ausnahme der Fovea capitis (Anheftung des Lig. Capitis femoris) mit Knorpel bedeckt\n• Acetabulum:\n➢ Nach außen-vorne-unten gerichtet\n➢ Halbkugelförmige Depression, die von Darm-/Sitz- und Schambein gebildet wird\n➢ Facies lunata (sichelförmige knorpelüberzogene Gelenkfläche)\n➢ Fossa acetabuli (tiefere, von der Facies lunata umfasster Teil)\n➢ Incisura acetabuli (öffnet Acetabulum nach unten und begre fte-04","slot":"Hüfte","nr":4,"frage":"Was fällt dir zur Fovea capitis femoris ein?","antwort":"Erkläre: Lig. Capitis femoris, Lig. Transversum acetabuli, Zona orbicularis\nLig.Capitis femoris:\n• Verlauf:\n➢ V om Rand der Incisura acetabuli und vom Lig. Transversum acetabuli zur Fovea capitis femoris\n➢ Intraartikulär und anfangs eingebettet in das Fett – und Bindegewebe der Fossa acetabuli\n• 3 Bündel:\n➢ Posteriorbündel: verlässt acetabulum über incisura acetabuli (unter Lig. Trasverum acetabuli) und heftet sich\nhinter/unter dem Cornu posterior der Facies lunata an\n➢ Medialesbündel: heftet sich am Oberrand des Lig. Transversum an\n➢ Anteriorbündel: heftet sich in der Incisura acetabuli hinter dem Cornus anterius der Facies lunata an\n• Das Lig. Capitis femoris hat keine große mechanische Wirkung, ist sehr resistent (45kg), hat eine propriozeptive Wirkung\n• Enthält die A. capitis femoris aus der A. obturatoria\n• DD: Hüftkopfnekrose ; M. perthes, Epiphyseolysis capitis femoris\n Lig. Transversum acetabuli:\n• Verlauf:\n➢ V on einem Rand der Incisura acetabuli zur anderen\n• Verschließt die Incisura acetabuli bis auf Lücken für Gefäße\n• Mitbeteiligung an der Gelenkfläche\n• Bildet Ansatzfläche für den Medialbündel des Lig. Capitis femoris\n Zona orbicularis:\n• Durch die Fibrae circulares der Capsula articularis gebildet\n• Umgreift den Femurhals Ringförmig\n• Hat keine Knocheninsertionen\n• Alle 3 Gelenkbänder (Lig. Pubofemorale, Lig. Ischiofemorale, Lig. Iliofemorale) sind mit der Zona orbicularis fest\nverwachsen\n• Stabilisiert den Femurkopf in der Pfanne und beugt Hüftgelenksluxationen vor","stern":false,"pruefen":true,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-05","slot":"Hüfte","nr":5,"frage":"Welche anatomischen Strukturen kannst du am Os coxae benennen?","antwort":"Os sacrum:\n• Dura Mata\n• Beckenorgane und Abdomen\n• Self-locking\nMuskulatur:\n• gluteus minimus\n• tensor fascie latae\n• piriformis\n• biceps über fascien + Bänder\nSymphysis pubica:Gelenkfläche:\n• Fascia symphycilis\ndiscus interpubicusBänder:\n• Lig. pubicum superus ventrale/dorsale\n• Lig. arcuatum pubis\n• Lig. pubicum ant/post\nMuskeln:\n• BM, BeBo,\n• M. obliquus ext.\n• M. pyramidales\n• Add longus/brevis, gracilis\nFunktionen:\n• Self-locking-system\n• Kraftübertragung/Verteilung an die umliegenden Strukturen\n• Puffersystem/Stoßdämpfer\n• Miktion/Defäkation\n• BeBo Muskeln Ansätze","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-06","slot":"Hüfte","nr":6,"frage":"Nenne die Muskeln, die am Trochanter major / minor ansetzen plus Funktion und nervale Versorgung","antwort":"M. piriformis:\n• U: Fascies Pelvica des Sacrums S2-4\n• I: Plexus sacralis\n• F: HG à AR, ABD, EXT, Stabi\nM. obturatorius internus:\n• U: Innenfläche der Membrana obturatoria und ihren knöchernen Rahmen\n• I. plexus sacralis\n• F: HG à zusammen mit dem M. qudratus femoris stärkster Muskel für die AR, beim Sitzen und bei nach vorne gehobenem\nBein wirkt er abduktorischM. obturatorius externus:\n• U: Außenfläche der membrana obturatoria und ihren knöchernen Rahmen\n• I: N. obturatorius (L1-L4)\n• F: HG à AR und schwache ADD\nM. gemellis sup/inf:\n• U: M. gemelli sup. à Spina ischiadica, M. gemelli inf. à Tuber ischiadicum\n• I: Plexus sacralis (L5-S2), N. gluteus inf.\n• F: unterstützen den M. obturatorius internus (AR und schwache ADD)\nM. quadratus femoris:\n• U: Tuber ischiadicum und zieht als viereckige Muskelplatte zur crista intertrochanterica\n• I: N. gluteus inf., plexus sacralis (L5-S2)\n• F: kräftiger AR und ADD des Oberschenkels\n M. gluteus medius:\n• U: Fascies glutea der Ala ossis ilii\n• I: N. gluteus sup (L4-L5)\n• F: IR und Beuger (vordere Faseranteil), AR und EXT (hintere Faseranteil) Hauptfunktion in der Gesamtheit ABD (tanzen)\nM. gluteus minimus:\n• U: Fascies glutea der Ala ossis ilii\n• I: N. gluteus sup. (L4-L5)\n• Entspricht der Funktion des M. gluteus med. Er ist jedoch ein schwächerer ABD","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-07","slot":"Hüfte","nr":7,"frage":"Erkläre den CCD-Winkel mit seinen Veränderungen im Verlauf des Lebens, sowie seinen Abweichungen auch in Verbindung mit Trag- und Kraftlinie der unteren Extremität","antwort":"Beschreibe den CCD-Winkel vom Hüftgelenk\n• CCD Winkel:\n➢ Centrum-Collum-Diaphysenwinkel = Neigungswinkel oder Schenkelhalswinkel\n➢ Die Achse des Schenkelhalses und die Achse des Schaftes bilden den Kollodiaphysenwinkel\n➢ Beträgt beim NG ca. 150°\n➢ Pubertät ca. 133°\n➢ Erwachsene ca. 126°\n➢ Im Alter 120°\n➢ Durch den abnehmenden Winkel wird der Hebel länger und die Schwerkräfte auf den Schenkelhals nehmen zu\n➢ Coxa vara CCD <120°(genu valgum X im Knie, SH#), Coxa Valga CCD > 140° (genu varum 0 Knie)àOsteoporose!\n➢ Der CCD Winkel beeinflusst die Stellung des Femurschaftes, somit die Traglinie des Beines\n➢ Traglinie: Mitte Caput femoris, Mitte KG, Mitte Calcaneus","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-08","slot":"Hüfte","nr":8,"frage":"Was fällt dir zum Antetorsionswinkel ein? (physiologische Entwicklung, pathologische Abweichungen, Veränderung der Beinachse IR/AR)","antwort":"Wie groß ist der Antetorsionswinkel bei Erwachsenen und bei Neugeborenen?\n• Antetorsionswinkel oder Femurtorsionswinkel beträgt beim NG ca. 30-40° Antetorsion\n• Erwachsenen Mann: ca. 10° Antetorsion\n• Erwachsene Frau: ca. 20° Antetorsion\n• Der Antetorsionswinkel beschreibt die interne Verdrehung des Femurs in Bezug von Collum und Caput auf die Condylen\n• Wird gebildet durch die Kollumachse und Kondylenachse","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-09","slot":"Hüfte","nr":9,"frage":"Nenne die Ligamente des Hüftgelenkes mit Verlauf und Funktion","antwort":"Erkläre: Lig. Capitis femoris, Lig. Transversum acetabuli, Zona orbicularis\nLig.Capitis femoris:\n• Verlauf:\n➢ V om Rand der Incisura acetabuli und vom Lig. Transversum acetabuli zur Fovea capitis femoris\n➢ Intraartikulär und anfangs eingebettet in das Fett – und Bindegewebe der Fossa acetabuli\n• 3 Bündel:\n➢ Posteriorbündel: verlässt acetabulum über incisura acetabuli (unter Lig. Trasverum acetabuli) und heftet sich\nhinter/unter dem Cornu posterior der Facies lunata an\n➢ Medialesbündel: heftet sich am Oberrand des Lig. Transversum an\n➢ Anteriorbündel: heftet sich in der Incisura acetabuli hinter dem Cornus anterius der Facies lunata an\n• Das Lig. Capitis femoris hat keine große mechanische Wirkung, ist sehr resistent (45kg), hat eine propriozeptive Wirkung\n• Enthält die A. capitis femoris aus der A. obturatoria\n• DD: Hüftkopfnekrose ; M. perthes, Epiphyseolysis capitis femoris\n Lig. Transversum acetabuli:\n• Verlauf:\n➢ V on einem Rand der Incisura acetabuli zur anderen\n• Verschließt die Incisura acetabuli bis auf Lücken für Gefäße\n• Mitbeteiligung an der Gelenkfläche\n• Bildet Ansatzfläche für den Medialbündel des Lig. Capitis femoris\n Zona orbicularis:\n• Durch die Fibrae circulares der Capsula articularis gebildet\n• Umgreift den Femurhals Ringförmig\n• Hat keine Knocheninsertionen\n• Alle 3 Gelenkbänder (Lig. Pubofemorale, Lig. Ischiofemorale, Lig. Iliofemorale) sind mit der Zona orbicularis fest\nverwachsen\n• Stabilisiert den Femurkopf in der Pfanne und beugt Hüftgelenksluxationen vor","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-10","slot":"Hüfte","nr":10,"frage":"Nenne die Strukturen die durch das Trigonum laterale und mediale verlaufen","antwort":"6. Beschreibe Trigonum femorale mediale (lacuna vasorum)\n• Trigonum von Scarpa\n• Grenze:\n➢ M. adductor longus, M. sartorius, Lig. inguinale\n• Inhalt: (von der Oberfläche in die Tiefe)\n➢ Subcutangewebe mit V . saphena magna und Nodi lymphatici inguinales\n➢ Aponeurosis femoralis mit oberflächlichem Blatt und tiefem Blatt (bilden den vasorum und erstreckt sich vom\nLeistenband zum Hiatus saphenus. Ein Kanal bildet erst bei einer Schenkelhernie.\n➢ V . Femoralies, A. femoralis (von innen nach außen „IV AN“)\n7. Beschreibe Trigonum femorale laterale (lacuna musculorum)\n• Zwischen M. sartorius und M. tensor fasciae latae gelegen\n• In der Tiefe: Muskel-Sehen-Übergang des M. rectus femoris palpierbar\n• Inhalte: M. iliopsoas, Bursa iliopectinea, N. femoralis, N. cutaneus femoralis lat. ( Sensistörung lat. Femur/OS durch\nMuskelläsion/Spannung","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-11","slot":"Hüfte","nr":11,"frage":"Beschreibe die Faktoren, die für die große Stabilität des Hüftgelenkes verantwortlich sind","antwort":"Durch welche Faktoren erhält das Hüftgelenk seine große Stabilität?\n• Hohe Kongruenz der Knochenstruktur (Gelenkform, Nussgelenk)\n• Mehr als die Hälfte des Caput femoris liegt innerhalb der knöchernen-bindegewebigen Pfanne\n• Bänder: stärkste Bänder im Körper:\n➢ Lig. iliofemorale: vom Os ilium (unter SIAS) zwischen Linie trochanterica\n➢ Lig. pubofemorale: vom Os pubis (eminentia iliopectinea) zur Zona orbicularis und Femor (prox. Trochanter\nminor)\n➢ Lig. ischofemorale\n• Die Bänder bilden auf der Gelenkvorderseite das „N“ von Welcker (Lig. von Bertini)\n➢ Oberer Grundstrich = oberes Bündel des Lig. iliofemorale\n➢ Mittlerer Grundstrich = unteres Bündel des Lig. iliofemorale\n➢ Unterer Grundstrich = Lig. pubofemorale (dazw. Bursa des M. iliopsoas)\n• Bei Flexion geht das „N“ auseinander. Bei Flexion der rechten Hüfte wickeln sich die Bänder im Uhrzeigersinn um den Hals\n(Ansicht von lateral) und spiralisieren sich bei Extension à Kontakt Kopf-Pfanne erhöht sich (Dreh-Mechanismus)\n• Muskulatur\n• Statik, Kraftverteilung im Gelenk","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung n knöchernen Rahmen\n• I: N. obturatorius (L1-L4)\n• F: HG à AR und schwache ADD\nM. gemellis sup/inf:\n• U: M. gemelli sup. à Spina ischiadica, M. gemelli inf. à Tuber ischiadicum\n• I: Plexus sacralis (L5-S2), N. gluteus inf.\n• F: unterstützen den M. obturatorius internus (AR und schwache ADD)\nM. quadratus femoris:\n• U: Tuber ischiadicum und zieht als viereckige Muskelplatte zur crista intertrochanterica\n• I: N. gluteus inf., plexus sacralis (L5-S2)\n• F: kräftiger AR und ADD des Oberschenkels\n M. gluteus medius:\n• U: Fascies glutea der Ala ossis ilii\n• I: N. gluteus sup (L4-L5)\n• F: IR und Beuger (vordere Faseranteil), AR und EXT (hintere Faseranteil) Hauptfunktion in der Gesamtheit ABD (tanzen)\nM. gluteus minimus:\n• U: Fascies glutea der Ala ossis ilii\n• I: N. gluteus sup. (L4-L5)\n• Entspricht der Funktion des M. gluteus med. Er ist jedoch ein schwächerer ABD","stern":false,"pruefen":true,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-15","slot":"Hüfte","nr":15,"frage":"Welche Nerven (mit WS-Niveau) versorgen den Bereich des Hüftgelenkes? Muskeln, Dermatom, Gelenkkapsel","antwort":"Nerven der Hüftgelenksmuskeln\n• Plexus lumbalis (Merkspruch: In Indien gibt's kein frisches Obst)\nN. iliohypogastricus Th12–L1 (\"In\")\n - R. cutaneus lat.: Haut caudal der SIAS\n - R. cutaneus ant.: Haut oberhalb der SIAS\nN. ilioinguinalis L1 (\"Indien\")\n - R. cutaneus ant.: Haut im Symphysenbereich\nN. genitofemoralis L1–2 (\"gibt's\")\n - R. femoralis: Haut im Leistenbereich\nN. cutaneus femoris lateralis L2–3 (\"kein\"): ventraler/lateraler Oberschenkel bis Knie\nN. femoralis L1–4 (\"frisches\")\n - Rr. musculares: M. iliopsoas, M. pectineus, M. sartorius, M. quadriceps\n - R. cutaneus: Haut medialer Oberschenkel\n - R. articularis: ventraler Gelenkbereich\nN. obturatorius L2–4 (\"Obst\")\n - R. posterior: M. obturatorius ext., M. adductor magnus\n - R. anterior: M. pectineus, M. adductor longus und brevis, M. gracilis\n - R. cutaneus: medialer und distaler Oberschenkel\nN. obturatorius accessorius: caudaler Gelenkbereich\n• Plexus sacralis (Merkspruch: Gute Gäste kommen immer pünktlich)\nN. gluteus superior (\"Gute\"): Mm. gluteus medius und minimus, M. tensor fasciae latae, Kapsel\nN. gluteus inferior L5–S2 (\"Gäste\"): M. gluteus maximus, Mm. gemelli, M. quadratus femoris\n - R. articularis: cranio-lateraler Gelenkbereich\nN. cutaneus femoris posterior (\"kommen\")\nN. ischiadicus (\"immer\"), durch das Foramen infrapiriforme: M. biceps femoris, M. semitendinosus, M. semimembranosus, M. quadratus femoris\n - R. acetabularis: dorsaler Gelenkbereich\n - Rr. musculares: M. piriformis, Mm. gemelli, M. obturatorius internus\nN. pudendus (\"pünktlich\")","stern":false,"pruefen":false,"neu":false,"quelle":"Antworten Parietale Abschlussprüfung"},{"id":"Hüfte-16","slot":"Hüfte","nr":16,"frage":"Nenne die Blutversorgung des Hüftgelenkes","antwort":"• Hauptast à A. femoralis aus der A. iliaca externa\n• Weitere Aufteilung à Daraus hervorgehend die Lateralezweige aus der A. femoralis profunda:\n➢ Circumflexa femoralis medialis (Ramus profundus) und lateralis (Ramus ascendenz) geben Zweige ab für das\nCollum und Caput femoris\n➢ Ramus acetabularis aus der A. obturatoria (A. iliaca interna). Er zieht durch die Incisura acetabuli in das Lig. Capitis\nfemoris. Er versorgt den anterioinferioren Teil des Gelenkes\n➢ A. glutea inferior (A. iliaca interna) Anastomose mit den Aa. Circumflexae femoris, versorgt den hinteren Anteil des\nGelenkes\n➢ Ramus profundus der A. glutea superior (A. iliaca interna) versorgt den oberen Teil des Gelenkes","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-17","slot":"Hüfte","nr":17,"frage":"Beschreibe die anatomischen Verbindungen zwischen dem Hüftgelenk und dem kleinen Becken","antwort":"Welche Verbindungen kennst du vom Hüftkopf / Femur zum kleinen Becken?\nM. obturatorius internus und externus, M. gemellus inf. et sup., M. quadratus femoris, M. piriformis","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-18","slot":"Hüfte","nr":18,"frage":"Was bedeutet die Konkav-Konvex Regel in Bezug auf das Hüftgelenk?","antwort":"Erkläre die Konvex/Konkavregel am Beispiel des Hüftgelenkes\nDie Konvex-Konkav-Regel ist ein theoretisches Modell der Arthrokinematik.\n• Konvexregel:\n➢ Bei der Bewegung des konvexen Gelenkpartners findet das Rollen immer in die gleiche Richtung der Rotation und\ndas Gleiten immer in die gegensinnige Richtung der Rotation statt\n• Konkavregel:\n➢ Bei der Bewegung des konkaven Gelenkpartners findet das Rollen bzw. Schaukeln und das Gleiten immer in die\ngleiche Richtung der Rotation statt\n• Bsp. HG:\n➢ Hüftkopf ist konvex, deshalb gleitet das Gelenk entgegen der Rotation","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-19","slot":"Hüfte","nr":19,"frage":"Beschreibe die arthrokinematische Bewegung aller Bewegungsrichtungen","antwort":"• Flexion: Caput rollt nach ventral, gleitet nach dorsal • Extension: Caput rollt nach dorsal und gleitet nach ventral • Abduktion: Caput rollt nach Cranio-lateral, gleitet nach caudal-medial • Adduktion: Caput rollt nach caudal-medial, rollt nach Cranio-lateral • Außenrotation: Caput rollt nach dorsal, gleitet nach ventral • Innenrotation: Caput rollt nach ventral, gleitet nach dorsal","stern":false,"pruefen":false,"neu":false,"quelle":"Antworten Parietale Abschlussprüfung"},{"id":"Hüfte-20","slot":"Hüfte","nr":20,"frage":"Warum ist es für das praktische Arbeiten wichtig die weiterlaufenden Bewegungen zu kennen?","antwort":"weiterlaufende Bewegungen im praktischen Arbeiten Können Ursache für sekundär-kompensatorische Dysfunktionen sein Hüfte-Knie-Fuß Hüfte-ISG-LWS-BWS….","stern":false,"pruefen":false,"neu":false,"quelle":"Antworten Parietale Abschlussprüfung"},{"id":"Hüfte-21","slot": {"id":"Hüfte-25","slot":"Hüfte","nr":25,"frage":"Wie entstehen sekundär-kompensatorische Dysfunktionen?","antwort":"1. Kompensation und osteopathische DysfunktionenDysfunktionen:\na. bedeutet Einschränkung und Verlust von Beweglichkeit/Funktion in eine oder mehrere Richtungen.\nOsteopathische Dysfunktion\nb. eine ertastbare Einschränkung der Gewebemobilität als Richtlinie für Diagnose und Therapie. Die Dysfunktionsrichtung ist\ndie bewegungsfreie Richtung!!Primäre Dysfunktion → primär traumatisch, als Schutz gegen eine drohende Schädigung, in der Anamnese ist einbekannter Beginn typischSekundäre Dysfunktion → sekundär kompensatorisch, als Anpassung an eine bereits bestehendeBewegungseinschränkung, als Folge einer primären Dysfunktion, in der Anamnese ist ein unbekannter/schleichenderBeginn typischKompensation: \nc. ist eine funktionelle Anpassung des Körpers an eine Dysfunktion, Genetik oder Anatomie. Kompensation muss keine\nDysfunktion sein. Das Hauptziel des Osteopathen ist den Patient kompensationsfähig zu machen.","stern":false,"pruefen":true,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-26","slot":"Hüfte","nr":26,"frage":"Welche Gelenke wirst du bei einer bestehenden Dysfunktion im Hüftgelenk mit untersuchen und warum?","antwort":"","stern":false,"pruefen":false,"neu":false,"quelle":"Antworten Parietale Abschlussprüfung"},{"id":"Hüfte-27","slot":"Hüfte","nr":27,"frage":"Benenne das Kapselmuster des Hüftgelenkes / Krankheitsbild","antwort":"• Das Kapselmuster der Hüfte ist ein typisches Zeichen der Coxarthrose.\n• Neben dem morgendlichen Anlaufschmerz ist das HG in IR>FLEX>EXT>ABD eingeschränkt\n• Die Adduktoren weisen einen Hartspann auf","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-28","slot":"Hüfte","nr":28,"frage":"Welche Behandlungsprinzipien kennst du und wann wendest du sie an?","antwort":"Behandlungsprinzipien Mobilisation MET-Techniken MEP- Techniken HVLA Arthrokinematische Behandlung: ligamentous articulär strains, Balance membranosus Tension","stern":false,"pruefen":false,"neu":false,"quelle":"Antworten Parietale Abschlussprüfung"},{"id":"Hüfte-29","slot":"Hüfte","nr":29,"frage":"Welche Symptome lassen dich an ein Femuroacetabuläres Impingement denken?","antwort":"• Beim FAI (Enge-Syndrom zwischen Hüftkopf und –pfanne) kommt es zu einem knöchernen Anschlag zwischen dem\nGelenknahen Anteil des Femurs und dem Acetabulum\n• Zwei Unterscheidungen:\n➢ Pincer FAI: Fehlstellung der Hüftpfanne in Form einer zu stark ausgeprägten\nOberschenkelkopfüberdachung (Beißzangen Impingement)\n➢ Cam FAI: Knöcherne V orsprünge am gelenknahen Oberschenkelhals und dadurch\nverursachte Einklemmung des Labrums (Nockenwellen Impingement)\n• Reine Pincer und Cam FAI sind selten, meistens tritt eine Kombination aus beiden auf\n• Lokalisation: am häufigsten anterior, dann posterior, selten lateral\n• Diagnostik: Radiologie\n• Epidemiologie: Pincer – eher Frauen um die 40 J. alt\nCAM – eher Männer um die 32 J. alt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Hüfte-30","slot":"Hüfte","nr":30,"frage":"Durch welche Erkrankungen können Parästhesien u./o. Paresen im Bereich des Hüftgelenkes ausgelöst werden?","antwort":"Parästhesien, Paresen #, Entzündungen, BSV, Tumore, Gravidität, MS","stern":false,"pruefen":false,"neu":false,"quelle":"Antworten Parietale Abschlussprüfung"},{"id":"Hüfte-31","slot":"Hüfte","nr":31,"frage":"Was fällt dir zum Symptom Leistenschmerz ein? Kenntniskontrolle sein","antwort":"Leistenschmerz • Coxarthrose, Kapselmuster - Iro, Flex, Extension, ABD • Vergrößerte Lymphknoten • Viszeral gleitender Schmerz • Leistenhernie • Kompression einzelner Nervenäste • Irritation Plexus lumbalis TH12-L1 • Claudicatio intermittens • Trauma • OP´s, Narben","stern":false,"pruefen":false,"neu":false,"quelle":"Antworten Parietale Abschlussprüfung"},{"id":"Knie-01","slot":"Knie","nr":1,"frage":"Was für eine Art von Gelenk (Gelentyp) ist das Kniegelenk?","antwort":"• Drehscharniergelenk / Bicondyläres Gelenk\n• Unterteilung in mediales und laterales Kompartiment (→ Art. femorotibialis) und Femoro-patelläres Kompartiment \n (→ Art. femoropatellare)\n• Bewegungsmöglichkeiten Art. femorotibialis passiv = Flex, Ex, IRO, ARO, ABD, ADD\n• Bewegungsmöglichkeiten Art.femoropatellare passiv= Gleiten der Patella nach caudal, cranial, medial und lateral","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-02","slot":"Knie","nr":2,"frage":"Beschreibe die Unterschiede zwischen dem medialen und lateralen Condylus der Tibia (Femur)","antwort":"• lateraler Condylus: Tibiacondylus ist von der Seite betrachtet konvex und von vorne betrachtet\nkonkav\nàlateraler Femurcondylus rollt länger (~25°) als der mediale Femurcondylus\n(~15°), da der Weg über die Konvexität etwas länger ist!\n• medialer Condylus: Tibiacondylus ist von der Seite und von vorne betrachtet konkav (eher plan)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-03","slot":"Knie","nr":3,"frage":"Beschreibe die distale Femurepiphyse","antwort":"• Knorpelflächen für Patella und Tibia\n• Besteht aus condylus mediale und laterale\n• Gleitschiene für die Patella liegt etwas weiter lateral und die Linea condylopatellaris lateralis ist deutlich höher als medial\n• Winkel zwischen medialer und lateraler Condyle beträgt ~20°","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-04","slot":"Knie","nr":4,"frage":"Was ist die Plica synovialis infra-/medio-/suprapatellaris?","antwort":"• Falten innerhalb des Kniegelenkes in der Kapsel → Synovia ist vorhanden\n• zum Corpus adiposum infrapatellare/Hoffa Fettkörper gehört plica synovialis infrapatellaris und Plica alares, dient somit für\nVerteilung der Kräfte und als Puffer\n• Plica synoviales infrapatellaris ist ein Überrest des Septum medianum und kommt weiterlaufend von Plicae alaris","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-05","slot":"Knie","nr":5,"frage":"Beschreibe den Pes anserinus","antwort":"• zwei Pes anserinus vorhanden (superficiales und profundus)\n• es laufen drei verschiedene Sehnen zusammen bzw. auseinander, die an einen Gänsefuß erinnern (lat. Pes)\n• Pes anserinus superficiales: wird gebildet von den Endsehnen M. sartorius, M.gracilis und\nM.semitendinosus; Ansatz unterhalb des Tibiakopfes medial der\nTuberositas tibiae, zwischen Pes anserinus und Innenband\nliegt Bursa anserina\n• Pes anserinus profundus: wird gebildet von dem M. semimembranosus, dessen drei Anteile\ndann weiter ziehen àzur medialen Tibia, dorsale Fläche Condylus\nmediale tibiae und eine Einstrahlung in die laterale Kapsel und zum\nlateralen Femurcondylus","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-06","slot":"Knie","nr":6,"frage":"Beschreibe die Unterschiede zwischen dem medialen und lateralen Meniskus","antwort":"• lateraler Meniskus: 2 Anheftungsstellen\n➢ Area intercondylaris anterius/posterius\n➢ beweglicher als der mediale Meniskus, bekommt Einstrahlungen von Popliteus und\nBiceps femoris, eher ringförmig\n• medialer Meniskus: 3 Anheftungsstellen\n➢ Area intercondylaris anterius, posterius + med. Gelenkkapsel mit Lig. collaterale\ntibiale\n➢ unbeweglicher als der lateraler Meniskus, bekommt Einstrahlungen von\nSemimembranosus, eher C-förmig","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-07","slot":"Knie","nr":7,"frage":"Beschreibe die Bewegungen der Menisci während F/E & IR/AR des Knies","antwort":"• bei Flexion bewegen sich die Menisci nach hinten\n• bei Extension bewegen sich die Menisci nach vorne\n• bei IRO bewegt sich der Innenmeniskus nach vorne und der Außenmeniskus nach hinten\n• bei ARO bewegt sich der Innenmeniskus nach hinten und der Außenmeniskus nach vorne\n• bei kombinierter Extension und Außenrotation bewegt der Innenmeniskus nach vorne/hinten und der Außenmeniskus nach\nvorne/vorne\n• bei kombinierter Extension und Innenrotation bewegt der Innenmeniskus nach vorne/vorne und der Außenmeniskus nach\nvorne/hinten\n• bei kombinierter Flexion und Außenrotation bewegt der Innenmeniskus nach hinten/hinten und der Außenmeniskus nach\nvorne/hinten\n• bei kombinierter Flexion und Innenrotation bewegt der Innenmeniskus nach hinten/vorne und der Außenmeniskus nach\nhinten/hinten","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-08","slot":"Knie","nr":8,"frage":"Welche aktiven/passiven Faktoren bestimmen die Bewegungen der Menisci?","antwort":"• Bei der Flexion werden die Menisken nach hinten gezogen über Ausläufer des M.semimembranosus, des LCA, Teile des\nM.popliteus → lat. Meniskus und Teile des M.biceps femoris → lat. Meniskus\n• Bei der Extension werden die Menisken nach vorne gezogen über die menisco-patellären Fasern + Lig.transversum genus (durch\nExtension wird Patella nach oben gezogen) und Spannung im Lig. meniscofemorale posterius\n• Qualität der Menisken (degenerativ)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-09","slot":"Knie","nr":9,"frage":"Der Innenmeniskus ist mehr geschlossen und kann fast doppelt so viel so viel sich nach antero-posterior bewegen hinsichtlich des Außenmeniskus?","antwort":"Außenmeniskus? Oder ähnlich\n• Falschà Korrekt wäre: AM ist geschlossener, aber beweglicher","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-10","slot":"Knie","nr":10,"frage":"Das Lig. Menisco-femorale post. (Wrisberg) - befindet sich auf dem medialen Vorderhorn Oj a On e i n - befindet sich auf dem lateralen Hinterhorn Oj a On e i n - hemmt die endgradige Flexion des Kniegelenkes Oj a On e i n - spannt sich bei der Extension des Kniegelenkes Oj a On e i n","antwort":"• zieht vom Crus posterior des Außenmeniskus zur medialen Femurcondyle und hat eine enge Lagebeziehung zum LCP (läuft\ndahinter)\n• trägt zur Stabilisierung des KG bei (begrenzt die Dorsalverschiebung der Tibia nach dorsal)\nbefindet sich auf dem medialen V orderhornO JaO Nein\nbefindet sich auf dem lateralen HinterhornX JaO Nein\nhemmt die endgradige Flexion des KniegelenkesO JaO Nein\nspannt sich bei der Extension des KniegelenkesX JaO Nein","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-11","slot":"Knie","nr":11,"frage":"Nenne 5 Funktionen der Menisci","antwort":"• Vergrößerung Gelenkfläche\n• Verminderung der Oberflächenspannung\n• Abnahme der Inkongruenz der Gelenkflächen\n• verantwortlich für Rotationssteuerung im Kniegelenk\n• regelmäßige Verteilung der Synovia\n• Stoßdämpfung\n• Verteilung der Belastung\n• Vergrößerung Stabilität\n• Gewichtsverteilung während der Belastung à die Lastübertragungszone wird ca. verdreifacht","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-12","slot":"Knie","nr":12,"frage":"Durch welche Angaben in der Anamnese denken Sie an eine strukturelle Problematik der Menisci?","antwort":"• Schmerz, z.B: Druckschmerz innen bzw. außen, beim in die Hocke gehen oder bei ROT\n• Schwellung\n• Bewegungseinschränkungen\n• evtl. Trauma bekannt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-13","slot":"Knie","nr":13,"frage":"Mit welchen Tests werden die Menisci untersucht?","antwort":"• Steinmann I und II (ruckartige IRO und ARO in verschiedenen Positionen, med. und lat. Gelenkspalt in Flex und Ex palpieren)\n• Apley-Kompressions-Test (unter axialer Druck IRO/ARO passiv)\n• Mc.-Murray-Test ( max.Flexion mit ARO, wieder Extension unter gehaltender ARO und zusätzlichem Valgusstress)\n• Payr-Zeichen (Schneidersitz)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-14","slot":"Knie","nr":14,"frage":"Was deutet auf eine Dysfunktion des Innenmeniskus in Posteriorität hin?","antwort":"• Dysfunktionsmechanismus: Focierte Bewegung in ABD auf einem gebeugtem/belasteten KG,\nMeniskus kann während der Rückkehr in Extension dem\nFemurcondylus nicht mehr folgen und bleibt posterior\nhinsichtlich des medialen Femurcondylus\n• die Extension wird eingeschränkt sein","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-15","slot":"Knie","nr":15,"frage":"Beschreibe den Mc Murray-Test am Beispiel des Innen- bzw","antwort":"• med. Meniskus:\n➢ Patient liegt in RL\n➢ Osteopath umfasst mit der einen Hand den Fuß, mit der anderen das Knie von lateral,\n➢ Ausführung:\nan beugen des KG unter maximaler Außenrotation, unter Beibehalt der Außenrotation wird das Bein wiederextendiert, jedoch wird zusätzlich ein Valgusstress ausgeführt mit der Hand, die am lateralen Knie liegt;positiv wäre der Test wenn eine Schmerzhaftigkeit und/oder ein Klicken im medialen Gelenkspalt auftritt\n• lat. Meniskus:\n➢ Patient liegt in RL\n➢ Osteopath umfasst mit der einen Hand den Fuß, mit der anderen das Knie von medial kommend,\n➢ Ausführung:\nan beugen des KG unter maximaler Innenrotation, unter Beibehalt der Innenrotation wird das Bein wiederextendiert, jedoch wird zusätzlich ein Varusstress ausgeführt mit der Hand, die am medialen Knie liegt\n➢ positiv wäre der Test wenn eine Schmerzhaftigkeit und/oder ein Klicken im lateralen Gelenkspalt auftritt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-16","slot":"Knie","nr":16,"frage":"Welcher Muskel fixiert den Innenmeniskus vornehmlich posterior? M. biceps femoris M. sartorius M. semimembranosus M. vastus medialis","antwort":"M. sartorius O korrektO nicht korrekt\nM. biceps femorisO korrektO nicht korrekt\nM. vastus medialisO korrektO nicht korrekt\nM. semimembranosusX korrektO nicht korrekt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-17","slot":"Knie","nr":17,"frage":"Die Kreuzbänder liegen extrasynovial und intrakapsulär evtl. Korrektur?","antwort":"• Die Kreuzbänder liegen intrakapsulär, aber extrasynovial, da embryologisch das KG aus zwei Gelenken bestand (medialer\nund lateraler Condylus). Somit liegen sie innerhalb der Kapsel (Membrana fibrosa) aber außerhalb der Synovia (Membranasynoviales)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-18","slot":"Knie","nr":18,"frage":"Erläutere die mechanische Bedeutung der Kreuzbänder","antwort":"• Generell sind die KB für die Stabi des Knies zuständig, wobei gleichzeitig durch den Faserverlauf eine Beweglichkeit\nerhalten bleibt\n• Während der Flexion lässt das LCA die Condylen nach hinten rollen und nach vorne gleiten\n• Während der Extension lässt das LCP die Condylen nach vorne rollen und nach hinten gleiten\n• Bei AR à Entspannung der KB\n• Bei IR à „Verwringung“ der KB (erhöhte Spannung)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-19","slot":"Knie","nr":19,"frage":"Beschreibe die Funktion(en) vom vorderen/hinteren Kreuzband","antwort":"• ermöglichen, führen und begrenzen Bewegungsmöglichkeiten im Kniegelenk\n• limitieren beim Roll-Gleitmechanismus das Gleiten\n• Stabilisierung des Kniegelenkes\n• LCP limitiert ext\n• LCA limitiert flex","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-20","slot":"Knie","nr":20,"frage":"Mit welchen Tests wird das vordere/hintere Kreuzband untersucht?","antwort":"• vorderes Kreuzband:\n➢ V ordere Schublade ( 90°KG Flex, Zug der Tibia nach ventral)\n➢ Lachmann-Test (25-30° Flex, Fixierung distaler OSCH, Zug der Tibia nach ventral)\n➢ Pivot- Shift-Test ( RL, eine Hand an der Ferse gibt zusätzlich einen axialen Druck, eine erzeugt einen\nValgusstress und Ventralshift distal des Kniegelenkes, das Bein wird unter Innenrotation des KG gebeugt)\n• hinteres Kreuzband:\n➢ Hintere Schublade (90°KG Flex, Druck der Tibia nach dorsal)\n➢ Gravity-sign (RL, HG und KG 90° Flex, ablegen der Fuße auf dem OSCH des Osteopathen)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-21","slot":"Knie","nr":21,"frage":"Wieso ist es nötig bei der Diagnostik einer Läsion des vorderen Kreuzbandes mit Hilfe des Schubladentests vorher eine Verletzung des hinteren Kreuzbandes auszuschließen?","antwort":"des hinteren Kreuzbandes auszuschließen?\n• Da sonst durch eine vermehrte Beweglichkeit, verursacht durch die Ruptur des LCP, der Eindruck entsteht, dass das vordere Kreuzband\ngerissen ist da die Bewegung von weiter hinten startet und damit größer erscheint","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-22","slot":"Knie","nr":22,"frage":"Beschreibe die Unterschiede vom Lig. collaterale mediale und laterale","antwort":"Lig. collaterale mediale Lig.collaterale laterale\nLang, breit und flach Rund, schmal und kurz\nVerwachsen mit Kapsel und medialem MeniskusKeine Verwachsung mit Kapsel und lateralem Meniskus\nÄhnlicher Verlauf wie VKB (hinten, oben, außen → vorne,unten, innen) Ähnlicher Verlauf wie HKB\nVerhindert mediales Aufklappen des Knies Verhindert laterales Aufklappen des Knies","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-23","slot":"Knie","nr":23,"frage":"Auf welche Weise wird das laterale/mediale Seitenband des Knies palpiert?","antwort":"• mediales Seitenband: Palpation des am medialen Kniegelenk, läuft nach vorne unten, palpierbar\nvom Tuberculum adductorium bis zum Condylus mediale der Tibia. Ggf. in das KG\nleicht flektieren\n• laterales Seitenband: Palpation am lateralen Kniegelenk, läuft nach unten hinten, palpierbar vom\nCaput fibulae bis zum Condylus lateralis des femurs, wird beim gebeugten Knie\npalpiert. Ggf. in das KG leicht flektieren","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-24","slot":"Knie","nr":24,"frage":"Beschreibe folgende arthrokinematische Begriffe: Swing, Slide, Slip & Spin","antwort":"• Swing: Bewegung, bei der die verschiedenen Punkte der Konvexität in der Bewegung Kontakt haben mit verschiedenen\nPunkten der Konkavität. Eine reine Swingbewegung ist schnell zu Ende. Eine Bewegung von konvex zu konkav nennt manRollbewegung, eine Bewegung von konkav zu konvex nennt man Schaukelbewegung\n• Slide(shit, glide): Bewegung, bei der ein bestimmter Punkt der Konvexität mit verschiedenen Punkten der Konkavität\nKontakt hat. Es ist eine geringe anguläre Bewegung aber eine große intraartikuläre Bewegung. Eine Bewegung von konvexzu konkav nennt man Schieben, eine Bewegung von konkav zu konvex nennt man Gleiten\n• Slip: Kombination aus Swing und Slide d.h. Verschiedene Punkte der Konvexität haben Kontakt mit einem Punkt der\nKonkavität z.B. durchdrehende Reifen im Sand\n• Spin: axiale Rotation","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-25","slot":"Knie","nr":25,"frage":"Swing ist eine Bewegung, bei der ein bestimmter Punkt der Konvexität Kontakt mit verschiedenen Punkten (der Konkavität) aufnimmt: evtl. Korrektur?","antwort":"aufnimmt\n• Nicht korrekt\n➢ Swing ist eine Bewegung bei der verschiedene Punkte der Konvexität in der Bewegung\nKontakt haben mit verschiedenen Punkten der Konkavität","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-26","slot":"Knie","nr":26,"frage":"Welche arthrokinematischen Tests werden auf Höhe des Knies ausgeführt?","antwort":"• Abduktion-/Adduktionsdysfunktion global und global Detail\n• Abduktionsdysfunktion Schwerpunkt Femur/Tibia\n• Adduktionsdysfunktion Schwerpunkt Femur/Tibia\n• Dysfunktion Tibia nach posterior/anterior\n• Außen-/Innenrotationsdysfunktion Tibia (MET, HVLA)\n• Dysfunktion medialer Meniskus in Posteriorität (MET und HVLA)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-27","slot":"Knie","nr":27,"frage":"Beschreibe den Befund einer Abduktionsdysfunktion Schwerpunkt Tibia","antwort":"• Primäre Abduktionsdysfunktion: \nmeist die Folge eines Stoßes/Sturzes mit dem Knie in Flexion und Abduktion,direktes Trauma bedeutet: Schmerz, Schwellung, Rötung, Wärme undFunktionsverlust/-einschränkung, zudem eine Empfindlichkeit des Lig.collateralemediale\nmeist physiologische Valgusstellung im Knie, entsteht auch durch Kompensation einer obenbzw. unten liegenden Dysfunktion; Lig.collaterale mediale ist nicht so stark wie dasLig.collaterale laterale, es entstehen Schmerzen auf Höhe der Anheftungen des\nLig.collaterale laterale, welches gedehnt wird bei der Testung. Keine Einschränkungen vonEx/Flex, lediglich im Verlust des Gelenkspiels.\n• Sekundäre Abduktionsdysfunktion: \nnicht so häufig, wird verursacht durch einen Schlag/Stoß auf das mediale KG, entsteht durchforcierte Adduktionsbewegung in leichter Flexionsstellung, Lig.collaterale laterale wirdgedehnt. Es tritt ein Verlust der Gelenkspiels durch eine gestörte Beweglichkeit des Femurshinsichtlich der Tibia auf.\n• Primäre Adduktionsdysfunktion:\n• Sekundäre Adduktionsdysfunktion: tritt auf durch Kompensation einer oben- oder untenliegenden Dysfunktion","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-28","slot":"Knie","nr":28,"frage":"Wo fängt die ligamentäre Fibrosierung bei einer ABD–/ADD-Dysfunktion des Kniegelenkes an? Erklärung","antwort":"• Primäre Abduktionsdysfunktion: Fibrosierung fängt an der Außenseite an d.h. Lig.collaterale laterale, M. tensor fascia lata,\nM. biceps femoris → Fixierung dieser Elemente in Dysfunktion\n• Sekundäre Abduktionsdysfunktion: Fibrosierung des Lig.collaterale mediale in Verlängerung und des Lig,collaterale laterale\nin Verkürzung\n• Adduktionsdyfunktion (sekundär): Lig.collaterale mediale fibrosiert in Verkürzung, Lig.collaterale laterale fibrosiert in\nVerlängerung; Muskelgruppe des Pes anserinus ist dafür verantwortlich","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-29","slot":"Knie","nr":29,"frage":"Eine Dysfunktion nach posterior der Tibia dem Femur gegenüber kann die Knie-Extension endgradig einschränken: evtl. Korrektur?","antwort":"• Korrekt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-30","slot":"Knie","nr":30,"frage":"Die tibiofemorale Innenrotation ist ein arthrokinematischer Bestandteil der : Knieflexion Oj a O nein Knieextension Oj a O nein","antwort":"• Flexion","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-31","slot":"Knie","nr":31,"frage":"Welche Dysfunktionen schränken die endgradige Knie-Extension ein: Tibia post AR-Dysfunktion IR-Dysfunktion DF Innenmeniskus post","antwort":"• Tibia posterior korrekt nicht korrekt\n• AR-Dysfunktion korrekt nicht korrekt\n• IR-Dysfunktion korrekt nicht korrekt\n• DF med Meniskus posterior korrekt nicht korrekt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-32","slot":"Knie","nr":32,"frage":"Was bedeutet Close-packed Position (CPP)?","antwort":"• größte Spannung in der Kapsel und den Ligamenten\n• größter Gelenkflächenkontakt\n• wichtig für stabilen Stand ohne muskuläre Anspannung","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-33","slot":"Knie","nr":33,"frage":"Wodurch zeichnet sich die „Close-packed Position“ des Kniegelenkes aus?","antwort":"• maximale Spannung im Kapselbandapperat\n• größter Gelenkflächenkontakt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-34","slot":"Knie","nr":34,"frage":"Das Lig. popliteum obliquum ist Teil des Ansatzes des: M. gracilis M. semitendinosus M. sartorius M. semitendinosus M. popliteus","antwort":"➢ Lig.collaterale laterale? M. semimembranosus\n• Das Band ist eine rückläufige Abspaltung des Muskels und verstärkt die Kapselwand auf der Rückseite. Seine\nVerlaufsrichtung ist ähnlich wie das des LCA","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-35","slot":"Knie","nr":35,"frage":"Was ist ein Hypomochlion?","antwort":"• Eine Umlenkrolle d.h. eine Struktur, die einen größeren Hebel bewirkt, sodass z.B. der M.quadriceps femoris eine\ngrößere Krafteinwirkung hat durch die Patella.","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-36","slot":"Knie","nr":36,"frage":"Nenne Ursprung und Ansatz, Innervation und Funktion vom M. popliteus","antwort":"• Condylus lateralis femoris, Caput fibulae und Hinterhorn Außenmeniskus à Hinterfläche Tibia und KG-Kapsel,\nInnervation erfolgt über N.tibialis (L4/L5), Funktion ist eine Flexion und Innenrotation im KG","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Knie-37","slot":"Knie","nr":37,"frage":"Nenne Ursprung und Ansatz, Innervation (auch die Segmenthöhe des Nervs in der LWS) und die Funktion des M. gracilis Kenntniskontrolle sein","antwort":"• Ramus inferior ossis pubis à medial des Tuberculum tibiae (Pes anserinus superficiales), Fascia cruis\n• Innervation: N. obturatoria (L2-L4),\n• Funktion: HG=Flex, Add, KG=Flex, IRO bei gebeugtem KG\nEin Anatomiebild zum Beschriften von anatomischen Strukturen kann ein Bestandteil der Kenntniskontrolle sein.\n Bei den schriftlichen Kenntniskontrollen stammen mindestens 80% der Fragen aus den bekannten Fragenkatalogen. Es ist möglich, dass bis zu20% der Fragen neu sind und noch nicht Bestandteil des aktuellen Fragenkataloges sind.\n Abschlussprüfung - Parietale\n Fuß","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-01","slot":"Fuß","nr":1,"frage":"Beschreibe das proximale tibiofibulare Gelenk (+ Formvarianten)","antwort":"• proximale Gelenkverbindung zwischen Fibula und Tibia\n• Fibula = Caput fibulae, Tibia = lat. Condylus von unten\n• nur kleine Bewegungen möglich, wobei die Fibula sich bewegt und die Tibia eher Punktum Fixum ist\n• gesichert durch Lig. capitis fibulae anterius/posterius\n• Formvarianten hinsichtlich Gelenkspaltorientierung (30° → eher horizontal orientiert bis zu 60° → eher vertikal orientiert","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-02","slot":"Fuß","nr":2,"frage":"Beschreibe die Bewegungsphysiologie der proximalen Fibula","antwort":"• Gleitbewegungsmöglichkeit nach anterior/lateral (bei ARO Tibia oder Flex KG) und posterior/medial (bei IRO Tibia oder Ex\nKG) (1-5mm)\n• Bewegung nach inferior bei PF und bei DE in Supination und Pronation nicht oder nur ganz minimal nach superior","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-03","slot":"Fuß","nr":3,"frage":"Beschreibe Syndesmosis tibiofibularis","antwort":"• distale feste Bandverbindung zwischen Fibula und Tibia (Elastizität vorhanden)\n• getrennt durch einen Syndesmosenspalt, gefüllt mit synovialer Falte (vom OSG)\n• Unterstützt durch Syndesmosenkomplex ( Ligg. Tibiofibularia ant./post., Ligg.tibiofibulare interosseum/transversale\nund der distale verstärkte Anteil der Membrana interossea)\n➢ wichtig für Kongruenz der Malleolengabel, Elastizität, federndes Widerlager und Absorption der axialen\nKräfte\n➢ Ist eine Schlitz- und Zapfenverbindung","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-04","slot":"Fuß","nr":4,"frage":"Beschreibe die Bewegungsphysiologie der distalen Fibula","antwort":"• bei DE im OSG bewegt die Fibula nach lateral, hinten und oben\n• bei PF im OSG bewegt die Fibula nach medial, vorne und unten\n• geringe Rotationsbewegungen der Fibula möglich aufgrund von schrägen und unregelmäßigen Form der Facies malleolaris\nlateralis der Trochlea tali → Drehrichtung inkonstant (IRO oder ARO) und hängt von anatomischer Facettenform der Faciesmalleolaris lateralis der Trochlea tali ab","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-05","slot":"Fuß","nr":5,"frage":"Beschreibe die (3D) Bewegungen der distalen Fibula während der Plantarflexion & Dorsalextension","antwort":"• bei PF bewegt der distaler Anteil der Fibula nach medial, unten, vorne und dreht sich ein wenig nach innen oder außen\n• bei DE bewegt der distale Anteil der Fibula nach lateral, oben, hinten und dreht sich ein wenig nach vorne oder außen","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-06","slot":"Fuß","nr":6,"frage":"Beschreibe den Aufbau & Zusammenstellung der Knöchelgabel","antwort":"• besteht aus Fibula und Tibia, die den Talus von oben umgabeln\n• werden durch Bänder fest zusammen gehalten:\n➢ Lig. tibiofibulare ant./post.\n➢ Lig.talofibulare post.\n➢ Membrana interossea\n➢ Lig.calcaneofibulare post.\n➢ Lig.deltoideum","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-07","slot":"Fuß","nr":7,"frage":"Beschreibe die Funktionen der Knöchelgabel","antwort":"• bei DE stoßdämpfende Bremswirkung (Talus wird i.d. Gabel gedrückt)\n• Übertragung Kraft von Fuß auf Unterschenkel bzw. umgekehrt\n• aufrechter und federnde Gang möglich\n• zuständig für stabilen Gelenkschluss\n• beteiligt an DE und PF","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-08","slot":"Fuß","nr":8,"frage":"Beschreibe die Bewegungsmöglichkeiten der distalen Tibia zum Talus","antwort":"• bei DE gleitet die Tibia nach anterior auf dem Talus\n• bei PF gleitet die Tibia nach posterior auf dem Talus","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-09","slot":"Fuß","nr":9,"frage":"Was für eine Art von Gelenk (Gelentyp) ist das obere & das untere Sprunggelenk?","antwort":"• OSG = Scharniergelenk mit guter Knochenführung → stabil\n• USG = anatomisch ein Eigelenk, funktionell ein Drehgelenk, besteht aus zwei Kammern getrennt vom Sinus tarsi","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-10","slot":"Fuß","nr":10,"frage":"Beschreibe die Orientierung der Kollagenfasern der Membrana interossea cruris","antwort":"• im oberen Anteil eher absteigende Fasern von Tibia zu Fibula → wichtig für Beweglichkeit der Fibula\n• im unteren Anteil verdichtet und in Criss-Cross-Technik → Stabilisiert und gibt Halt für die Knöchelgabel","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-11","slot":"Fuß","nr":11,"frage":"Beschreibe die Funktionen der Membrana interossea cruris","antwort":"• vergrößert Ansatzfläche für Muskeln\n• sorgt für Kraftübertragung\n• führt in Durchtrittslöchern Gefäße/Nerven\n• erlaubt/führt/kontrolliert und stabilisiert Bewegung der Fibula","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-12","slot":"Fuß","nr":12,"frage":"Welchen Einfluss hat die Membrana interossea auf die Hämodynamik des Unterschenkels und des Fußes","antwort":"• Die Membrana interossea hat einen großen Einfluss auf die Hämodynamik des Unterschenkels und des Fußes\n• die A./V . tibialis anterior (oben) und A./V . fibularis (unten) durchtreten die Membrana\n• Wenn es zu einer Spannungszunahme in der Membrana interossea kommt:\n➢ Durchtrittsstellen verkleinern sich à verschlechterten Hämodynamik\n• Es kann bei einer bestehenden Verletzung zu längeren Heilungszeiten kommen\n• Bei einer bestehenden Dysfunktion kann es zu Krampfadern, trockene/blasse Haut kommen à auch familiär klären","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-13","slot":"Fuß","nr":13,"frage":"Beschreibe die vordere/hintere/laterale Muskelloge vom Unterschenkel","antwort":"• vordere Loge:\n➢ M.tibialis anterius, M.extensor hallucis longus, M.extensor digitorum longus , M.fibularis tertius\n• hintere Loge:\n➢ M.tibialis posterius, M.flexor hallucis longus, M.flexor digitorum longus\n➢ Oberflächlich: M. Gastrocnemius\n• laterale Loge:\n➢ M.fibularis longus, M.fibularis brevis","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-14","slot":"Fuß","nr":14,"frage":"Beschreibe die Verbindungen (muskuläre Ketten) vom Os coxae zum Fuß","antwort":"• Tuber ischiadicus → M.biceps femoris → M.fibularis longus → Os cuboideum\n• Tuber ischiadicus → M.semimembranosus bzw. M.semitendinosus → M.tibialis anterius → Os cuneiforme mediale","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-15","slot":"Fuß","nr":15,"frage":"Beschreiben Sie die Muskelkette vom Os cuboideum bis zum Becken","antwort":"• Os cuboideum → M.fibularis longus → M.biceps femoris → Tuber ischiradicus","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-16","slot":"Fuß","nr":16,"frage":"Welche Auffälligkeiten in der Untersuchung weisen auf eine Instabilität der Syndesmosis tibiofibularis hin?","antwort":"• Schmerz\n• Schwellung\n• Stabilität in der Knochengabel beeinträchtigt\n• Diastasentest auffällig\n• Hypertone Muskulatur laterale Loge\n• Schwierigkeiten bei längerem Laufen / Treppensteigen\n• Druckschmerzhaftigkeit\n• Talus Test 1: sehr viel Bewegung nach lateral","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-17","slot":"Fuß","nr":17,"frage":"Stellen Sie den möglichen Zusammenhang einer Fibula-Dysfunktion bei einer Schwellung mit Anlaufschmerz des Fußes dar","antwort":"","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-18","slot":"Fuß","nr":18,"frage":"Beschreibe die Vorrausetzungen um ein Supinationstrauma bekommen zu können","antwort":"• Fuß befindet sich in Supination ++ bzw. Inversion ++\n• Fixierung Fuß am Boden, Ball, Gegner. Äußere Fußkante senkt sich ab und innerer Fußrand hebt ab\n• schnelle Umknickbewegung des Fußes mit Erreichen bzw. Überschreitung der physiologischen Bewegungsmöglichkeiten des\nFußes","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"Fuß-19","slot":"Fuß","nr":19,"frage":"Beschreibe was genau abläuft am Moment des “Umknickens” vom Fuß (bei einem Supinationstrauma)","antwort":"Grundlage:\n• Traumamechanismus 1:\n➢ Dysfunktionsbewegung des Fußes in Supination ++/Inversion ++ mit Fixation des Fußes\n➢ Calcaneus, Os cuboideum, Os talus und Os naviculare bewegen in ARO\n➢ Fibula bewegt nach inferior, anterior und medial (Knöchelgabel verengt sich!!!)\n➢ Unterschenkel macht (axiale) Außenrotation\n• Traumamechanismus 2:\n➢ Im Moment des Umknickens befindet sich der Unterschenkel in A         frage: q.kopf + ": " + it.b, antwort: it.a || "Keine Antwort hinterlegt.",

const SLOTS = ["ISG/SIG","LWS","BWS","Rippen","HWS","Hüfte","Knie","Fuß","OEX"];
const LABEL = {"OEX":"Obere Extremität","ISG/SIG":"Becken / ISG-SIG"};
const lab = s => LABEL[s] || s;
const byId = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random()*a.length)];
const pool = s => DATA.filter(q => q.slot === s);

byId("count").textContent = DATA.length + " Fragen";
const sel = byId("chapter");
SLOTS.forEach(s => {
  const o = document.createElement("option");
  o.value = s; o.textContent = lab(s) + " (" + pool(s).length + ")";
  sel.appendChild(o);
});

function buildExam(){
  const out = [], used = new Set();
  const take = s => { let q; do { q = pick(pool(s)); } while (used.has(q.id)); used.add(q.id); out.push(q); };
  ["Knie","Hüfte","Fuß"].forEach(take);
  take(pick(["Knie","Hüfte","Fuß"]));
  take("LWS");
  take(Math.random() < 0.2 ? "Rippen" : "BWS");
  take("HWS"); take("ISG/SIG");
  take("OEX"); take("OEX");
  return out;
}

let current = [], scores = [], mode = "exam";

function loadStats(){
  try { return JSON.parse(localStorage.getItem("bao721stats") || "{}"); } catch(e){ return {}; }
}
function saveStats(list, sc){
  try {
    const st = loadStats();
    list.forEach((q, i) => {
      const pct = Math.round((sc[i] || 0) / 2 * 100);
      const alt = st[q.id] || {n: 0, best: 0};
      st[q.id] = {letzte: pct, n: alt.n + 1, best: Math.max(alt.best || 0, pct)};
    });
    localStorage.setItem("bao721stats", JSON.stringify(st));
  } catch(e) {}
}
function schwacheFragen(){
  const st = loadStats();
  const mit = DATA.filter(q => st[q.id] && st[q.id].letzte <= 50)
    .sort((a,b) => st[a.id].letzte - st[b.id].letzte);
  return mit.slice(0, 15);
}
function fortschritt(){
  const st = loadStats();
  return SLOTS.map(s => {
    const p = pool(s);
    const gut = p.filter(q => st[q.id] && st[q.id].best >= 75).length;
    const ges = p.filter(q => st[q.id]).length;
    return {slot: s, gut, gesehen: ges, total: p.length};
  });
}

function render(list, examMode, modus){
  current = list; mode = modus || (examMode ? "exam" : "drill");
  scores = list.map(() => null);
  byId("home").classList.add("hide");
  byId("result").classList.add("hide");
  const host = byId("exam");
  host.classList.remove("hide");
  host.innerHTML = "";
  const stack = document.createElement("div");
  stack.className = "stack";
  list.forEach((q, i) => stack.appendChild(card(q, i, examMode)));
  host.appendChild(stack);
  const bar = document.createElement("div");
  bar.className = "bar";
  const left = document.createElement("button");
  left.textContent = "Abbrechen";
  left.onclick = home;
  const right = document.createElement("button");
  right.className = "primary";
  right.textContent = examMode ? "Auswerten" : "Fertig";
  right.onclick = examMode ? evaluate : home;
  bar.append(left, right);
  host.appendChild(bar);
  window.scrollTo(0,0);
}

  meta.innerHTML = '<span class="slot">' + (i+1) + '. ' + lab(q.slot) + '</span><span>' + q.id + '</span>'
    + (q.stern ? '<span class="flag" title="Nicht aus einem geprüften Korrekturbogen">✱ ungeprüft</span>' : '')
    + (q.pruefen ? '<span class="check" title="Antwort steht im Fließtext eines größeren Blocks">gegenlesen</span>' : '');
  const frage = document.createElement("p");
  frage.className = "q";
  frage.textContent = q.frage;
  const btn = document.createElement("button");
  btn.textContent = "Antwort zeigen";
  const ans = document.createElement("div");
  ans.className = "a hidden";
  renderAntwort(ans, q.antwort || "Keine Antwort hinterlegt.");
  if (q.quelle){
    const src = document.createElement("div");
    src.className = "src";
    src.textContent = "Quelle: " + q.quelle;
    ans.appendChild(src);
  }
  btn.onclick = () => {
    const open = !ans.classList.toggle("hidden");
    btn.textContent = open ? "Antwort verbergen" : "Antwort zeigen";
  };
  el.append(meta, frage, btn, ans);
  if (examMode){
    const sc = document.createElement("div");
    sc.className = "score";
    [0, 25, 50, 75, 100].forEach(pct => {
      const p = pct / 100 * 2;
      const b = document.createElement("button");
      b.textContent = pct + "%";
      b.setAttribute("aria-pressed", "false");
      b.onclick = () => {
        scores[i] = p;
        [...sc.children].forEach(c => c.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
      };
      sc.appendChild(b);
    });
    el.appendChild(sc);
    const hint = document.createElement("div");
    hint.className = "note";
    hint.textContent = "Wie viel der Antwort hättest du gewusst?";
    el.appendChild(hint);
  }
  return el;
}

function renderAntwort(host, text){
  const lines = String(text).split(/\n/).map(l => l.trim()).filter(Boolean);
  const hatPunkt = lines.some(l => /^[•]/.test(l));
  let buf = null;
  lines.forEach(line => {
    let lvl = 0, txt = line;
    if (/^[•]/.test(line)) { lvl = 1; txt = line.replace(/^[•]\s*/, ""); }
    else if (/^[➢▪‣»→]/.test(line)) { lvl = 2; txt = line.replace(/^[➢▪‣»→]\s*/, ""); }
    else if (/^[-–]\s/.test(line)) { lvl = hatPunkt ? 2 : 1; txt = line.replace(/^[-–]\s*/, ""); }
    else if (/^\d{1,2}[.)]\s/.test(line)) { lvl = 0; }
    else if (buf && /^[a-zäöüß(,;]/.test(line)) { buf.lastChild.textContent += " " + line; return; }
    const d = document.createElement("div");
    d.className = "l" + lvl;
    const m = txt.match(/^([^:]{2,45}):\s*(.*)$/);
    const span = document.createElement("span");
    if (m && m[2]) {
      const b = document.createElement("b");
      b.textContent = m[1] + ": ";
      d.appendChild(b);
      span.textContent = m[2];
    } else {
      span.textContent = txt;
    }
    d.appendChild(span);
    host.appendChild(d);
    buf = d;
  });
}

function grade(p){
  if (p >= 18) return 1;
  if (p >= 16) return 2;
  if (p >= 14) return 3;
  if (p >= 12) return 4;
  if (p >= 10) return 5;
  return 6;
}

function evaluate(){
  const offen = scores.filter(s => s === null).length;
  if (offen && !confirm(offen + " Fragen sind noch nicht bewertet. Sie zählen mit 0 Punkten. Trotzdem auswerten?")) return;
  const punkte = scores.reduce((a,b) => a + (b || 0), 0);
  const note = grade(punkte);
  saveStats(current, scores);
  if (mode === "exam") save(punkte, note);
  byId("exam").classList.add("hide");
  const host = byId("result");
  host.classList.remove("hide");
  host.innerHTML = "";
  const box = document.createElement("div");
  box.className = "card result";
  box.innerHTML = mode === "exam"
    ? '<p class="grade">' + note + '</p><p>' + String(punkte).replace(".", ",") + ' von 20 Punkten</p>'
    : '<p class="grade">' + Math.round(punkte / (current.length * 2) * 100) + '%</p><p>' + current.length + ' Fragen wiederholt</p>';
  const ul = document.createElement("div");
  ul.className = "hist";
  ul.innerHTML = "<ul>" + current.map((q,i) =>
      '<li><span>' + lab(q.slot) + ' · ' + q.id + '</span><span>' + String(scores[i] ?? 0).replace(".", ",") + '</span></li>').join("") + "</ul>";
  const again = document.createElement("button");
  again.className = "primary";
  again.style.marginTop = "16px";
  again.textContent = "Neue Prüfung";
  again.onclick = () => render(buildExam(), true);
  const back = document.createElement("button");
  back.style.marginTop = "16px";
  back.textContent = "Startseite";
  back.onclick = home;
  box.append(ul, document.createElement("br"));
  const row = document.createElement("div");
  row.className = "row";
  row.append(again, back);
  box.appendChild(row);
  host.appendChild(box);
  window.scrollTo(0,0);
}

function save(punkte, note){
  try {
    const h = JSON.parse(localStorage.getItem("bao721") || "[]");
    h.unshift({d: new Date().toISOString().slice(0,10), p: punkte, n: note});
    localStorage.setItem("bao721", JSON.stringify(h.slice(0,20)));
  } catch(e) {}
}

function history(){
  let h = [];
  try { h = JSON.parse(localStorage.getItem("bao721") || "[]"); } catch(e) {}
  const el = byId("history");
  if (!h.length){ el.innerHTML = "Noch keine Prüfung abgelegt."; return; }
  const schnitt = (h.reduce((a,b) => a + b.n, 0) / h.length).toFixed(1).replace(".", ",");
  el.innerHTML = "Bisherige Durchgänge – Schnitt " + schnitt + "<ul>" +
    h.map(x => '<li><span>' + x.d + '</span><span>' + String(x.p).replace(".", ",") + ' P · Note ' + x.n + '</span></li>').join("") + "</ul>";
}

function zeigeFortschritt(){
  const f = fortschritt();
  const ges = f.reduce((a,b) => a + b.gut, 0), tot = f.reduce((a,b) => a + b.total, 0);
  byId("fortschritt").innerHTML = "Sicher beantwortet (mindestens einmal 75% oder mehr): " + ges + " von " + tot +
    "<ul>" + f.map(x => '<li><span>' + lab(x.slot) + '</span><span>' + x.gut + " / " + x.total + '</span></li>').join("") + "</ul>";
  const sw = schwacheFragen();
  byId("schwachInfo").textContent = sw.length
    ? sw.length + " Fragen zuletzt mit 50% oder weniger bewertet."
    : "Noch keine schwachen Fragen – die Liste füllt sich nach deiner ersten Prüfung.";
  byId("startSchwach").disabled = !sw.length;
}

function home(){
  byId("exam").classList.add("hide");
  byId("result").classList.add("hide");
  byId("home").classList.remove("hide");
  history();
  zeigeFortschritt();
  window.scrollTo(0,0);
}

byId("startExam").onclick = () => render(buildExam(), true);
byId("startSchwach").onclick = () => render(schwacheFragen(), true, "schwach");
byId("startDrill").onclick = () => {
  const list = pool(sel.value).slice().sort((a,b) => a.nr - b.nr);
  render(list, false);
};
history();
</script>
