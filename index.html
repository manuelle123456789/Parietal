<style>
:root{

@media (prefers-color-scheme: dark){

    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#111820; --surface:#18212A; --ink:#E2E9EE; --muted:#93A5B2;
  --line:#2C3945; --teal:#5FB3AC; --teal-soft:#1B2E2E; --flag:#E08A74; --amber:#D8B04E;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;

.wrap{max-width:720px;margin:0 auto;padding:16px 16px 72px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:14px 0 10px;border-bottom:2px solid var(--ink)}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.45rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.82rem}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);

.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:grid;gap:14px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--teal);

.a{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;white-space:pre-wrap;font-size:.95rem}
.a.hidden{display:none}
.a{line-height:1.55}
.a .l0{margin:14px 0 6px;font-weight:600}
.a .l0:first-child{margin-top:0}
.a .l1{margin:12px 0 4px 0;padding-left:16px;position:relative}
.a .l1::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--teal)}
.a .l2{margin:4px 0 4px 30px;position:relative;font-size:.92rem}
.a .l2::before{content:"–";position:absolute;left:-14px;color:var(--muted)}
.a b{font-weight:600}
.src{margin-top:10px;font-size:.78rem;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.flag{color:var(--flag);font-weight:600}
.check{color:var(--amber)}
.score{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.score button{padding:8px 0;flex:1 1 52px;min-width:52px;text-align:center}
.score button[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);font-weight:600}
.bar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding:10px 0;margin-top:20px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.grade{font-family:Newsreader,Georgia,serif;font-size:3rem;line-height:1;margin:0}
.result{text-align:center;padding:22px 14px}
.hist{font-size:.9rem;color:var(--muted);margin-top:26px}
.hist ul{list-style:none;padding:0;margin:8px 0 0}
.hist li{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:6px 0}
select{font:inherit;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.note{color:var(--muted);font-size:.85rem;margin-top:10px}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

<script>
const RAW = [{"id":"ISG/SIG-01","slot":"ISG/SIG","nr":1,"frage":"Beschreibe die Funktion(-en) des Os sacrum, des Os coxae und des Os ilium","antwort":"Os sacrum:\n• Schutz von Organen im pelvis minor\n• Verbindung über Mm. → Kraftübertragung untere\nExtremität und WS\n• Aufrechterhaltung Dura Mata – Cranio\n• Teil des Self-locking-System\n• Blutspeicher\n• Wiederlager der Symphyse\n• Shift, slide, gapping\n• gehört funktionell zur WS\n• Puffer & Stoßdämpfer\n• Aufrechte Haltung\n• Bewegungen: unilaterale sacrumflexion re/li, extension\nre/li, torsion\n• über BeBo Miktion und Defäkation\n Os coxae:\n• self-locking\n• weiterleitung der Kraft auf die Hüfte auf den Beckengürtel\n• bildet das Becken\n• Aufrechte Haltung\n• sicherer Stand\n• Ansatz BM\n• 3 dimensionale Bewegung beim laufen\n• ant/post, IR/AR, Abd/add, torsions Bewegung beim gehen\nOs ilium:\n• gehört funktionell zur unteren Extremität\n• Torsionsbewegung beim gehen\n• Ansatz BM, M. levator ani (BeBo), M. iliacus, Mm. gluteaus\n• Levator Trichter\n• self-locking\n• inflaire / outflaire, ant. + post","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-02","slot":"ISG/SIG","nr":2,"frage":"Welche anatomische Strukturen/Elemente bestimmen die Funktion(-en) des Os sacrum, des Os coxae, des ISG/SIG und der Symphysis pubica?","antwort":"Os sacrum:\n• Dura Mata\n• Beckenorgane und Abdomen\n• Self-locking\nMuskulatur:\n• gluteus minimus\n• tensor fascie latae\n• piriformis\n• biceps femoris, semimembranosus, semitendinosus über\nsacrotuberalen Bänder\n• erector spinae trunci\n• levator ani\n• M. psoas major\n• sacrococcygeale Mm.\nOs coxae:\n• Form und Funktion des Sacrum\n• Form und Funktion des Hüftgelenks\n• Form und Funktion der Symphysis pubica\n• Geschlecht\nMuskulatur:\n• ilipsoas\n• gluteus maximus, gluteus medius, gluteus minimus, tensor\nfascie latae\n• piriformes, obturatorius internus, gemelli superior, gemelli\ninferior, quadratus femoris, obturatorius externus\n• pectineus, adductor longus, adductor brevis, adductus magnus,\nadductus minimus, gracilis,\n• biceps femoris, semimembranosus, semitendinosus\nBänder & Faszien:\n• iliolumbale Bänder\n• dorsale und ventrale iliosacrale Bänder\n• Sacrotuberale Bänder: sacroiliaca anteriora, sacroiliaca\nposteriora, sacroiliaca interosseasacrospinale, sacrotuberale\n• Gelenkkapselstrukturen\n• Fascia thorakolumbale\n• laminae sacropubicale\nGelenke & Knochen:\n• ISG/SIG (Form Relief der Gelenkfläche – Fasies auricularis)\n• symphysis pubica\n• Wirbelgelenke\n• BS L5-S1\n• Sacrococcygeales Gelenk\n• lumbosacrale Übergangsanomalien\n• Degenerative Änderungen\n• Pathologien\n• sartorius\n• erector spinae trunci, quadratus lumborum,\n• levator ani, coccygeus\n• latissimus dorsi\n• transversus abdominis, obliquus abdominis internus, obliquus\nabdiminis externus, pyramidalis, rectus abdominisBänder & Faszien\n• iliolumbale Bänder\n• dorsale und ventrale iliosacrale Bänder\n• Sacrotuberale Bänder: sacroiliaca anteriora, sacroiliaca\nposteriora, sacroiliaca interosseasacrospinale, sacrotuberale\n• transversum acetabuli,\n• Gelenkkapselstrukturen\n• iliofemorale, pubofemorale, ischiofemorale,\n• pubicum superius ventrale, pubicum superius dorsale\n• Fascia thorakolumbale, obturatorius internus, Linea alba, Fascia\nglutea\n• laminae sacropubicale\nISG/SIG:L-Förmige facies auricularisBänder:\n• Lig. sacroiliaca dorsale/ventrale\n• Lig. interossea\n• Lig. iliolumbale\nMuskeln:\n• M. iliacus\n• ischios über fascien + Bänder\nSymphysis pubica:Gelenkfläche:\n• Fascia symphycilis\ndiscus interpubicusBänder:\n• Lig. pubicum superus ventrale/dorsale\n• Lig. arcuatum pubis\n• Lig. pubicum ant/post\nMuskeln:\n• BM, BeBo,\n• M. obliquus ext.\n• M. pyramidales\n• Add longus/brevis, gracilis\nFunktionen:\n• Self-locking-system\n• Kraftübertragung/Verteilung an die umliegenden Strukturen\n• Puffersystem/Stoßdämpfer\n• Miktion/Defäkation\n• BeBo Muskeln Ansätze","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-03","slot":"ISG/SIG","nr":3,"frage":"Beschreibe/benenne die Bewegungen des Os coxae im 3-dimensionalen Koordinatensystem","antwort":"• Abduktion/Adduktion\n◦ sagittotransversale Achse, Frontalebene\n• Flexion/Extension\n◦ frontotransversale Achse, Sagitalebene\n• Innenrotation /Außenrotation \n◦ frontosagitale Achse, Transversalebene\n• Zirkumduktion = Zusammengesetzte Bewegungen beim\nBeinkreisen\n• anteriore Rotation\n◦ Crista ventral, tuber dorsal\n• posteriore Rot\n◦ Crista dorsal, tuber ventral\n• abduktion\n◦ Crista außen, tuber innen\n• adduktion\n◦ Crista innen, tuber außen\n• Innenrotation\n◦ SIAS innen, SIPS außen\n• Außenrotation\n◦ SIAS außen, SIPS innen","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-04","slot":"ISG/SIG","nr":4,"frage":"Inflare vom Ilium bedeutet die Kombination von Adduktion und Innenrotation?","antwort":"Inflare/Outflare ISG\n• Inflare\n◦ ADD + AR, physiologisch mit einer posterioren Rotation\n• Outflare\n◦ ABD + IR, physiologisch mit einer anterioren Rotation","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-05","slot":"ISG/SIG","nr":5,"frage":"Beschreibe den Befund der Dysfunktion Ilium anterior, posterior, Up-slip, In- bzw. Outflare (klassisch und/oder über die Poltests)","antwort":"• Ilium anterior\n◦ Ftst ++, Ftsi + auf einer Seite\n◦ Downingtest Verkürzungstest positiv (kaum oder gar nicht möglich)\n◦ Poltest 1 und 3 resistent (Iliumhand = Testhand, Sakrum = Fixationshand)\n• Ilium posterior\n◦ Ftst ++, Ftsi + auf einer Seite\n◦ Downingtest Verlängerung positiv (kaum oder gar nicht möglich)\n◦ Poltest 2 und 4 resistent (Iliumhand = Testhand, Sakrum = Fixationshand)\n• Up slip\n◦ Ftst ++, Ftsi +\n◦ Downing Verlängerung- und Verkürzungstest = kein Unterschied (beide geich groß oder gleich klein)\n◦ SIAS+SIPS+Crista iliaca einseitig höher, ein Bein ist länger\n• Inflare\n◦ Ftst ++, Ftsi +\n◦ Downingtest kein Unterschied\n◦ Abstand SIAS-Nabel einseitig kleiner, Test für AR und ADD sind positiv\n• Outflare\n◦ Ftst ++, Ftsi +\n◦ Downingtest kein Unterschied\n◦ Abstand SIAS-Nabel einseitig größer, Test für IR und ABD sind positiv","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-06","slot":"ISG/SIG","nr":6,"frage":"Bei einer Iliumdysfunktion nach posterior gibt’s eine Einschränkung der Shiftbewegung nach postero-superior auf dem kurzen Pol, auf derselben Seite?","antwort":"• nicht korrekt, es gibt eine Shiftbewegng nach anterior-inferior d.h. Griff 2 ist resistent\n• Iliumdysfunktion nach anterior = Shiftbewegung nach postero-superior d.h. Griff 1 ist resistent","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-07","slot":"ISG/SIG","nr":7,"frage":"Beschreibe den Befund der ISG-Dysfunktion: Sacrum li/li, re/re, re/li, li/re, unilaterale Flexion & unilaterale Extension (klassisch und/oder über die Poltests)","antwort":"• Sacrum li/li (Anteriore Dysfunktion): Bsp re \n◦ Ftsi ++, Ftst +\n◦ Sulcus hohl (er) re\n◦ AIL links prominenter\n◦ Rebound ist elastisch global, re mehr\n◦ Poltest 2 und 4 resistent (Sakrumhand = Testhand)\n• Sacrum re/re (Anteriore Dysfunktion): Bsp li\n◦ Ftsi ++, Ftst+\n• Sakrum li/re (Posteriore Dysfunktion): Bsp li\n◦ Ftsi ++, Ftst+\n◦ Sulcus li voll (er)\n◦ AIL re weniger prominent\n◦ Rebound resistent\n◦ Poltest Griff 1 und 3 resistent (Sakrumhand\n=Testhand)\n• Sakrum unilaterale Flex li:\n◦ Ftst +, Ftsi ++\n◦ Sulcus li hohl(er)\n◦ AIL re promineter\n◦ Rebound ist global elastisch li mehr\n◦ Poltest 2 und 4 resistent (Sakrumhand = Testhand)\n• Sakrum re/li (Posteriore Dysfunktion): Bsp re\n◦ Ftsi ++, Ftst +\n◦ Sulcus re voll (er)\n◦ AIL li weniger prominent\n◦ Rebound resistent\n◦ Poltest Griff 1 und 3 resistent (Sakrumhand =\nTesthand)\n \n◦ Sulcus li hohl (er)\n◦ AIL li prominenter\n◦ Rebound elastisch\n◦ Poltest li Griff 2 und 4 resistent (Sakrumhand =\nTesthand)\n• Sakrum unilaterale Ex re:\n◦ Ftst +, Ftsi ++\n◦ Sulcus li hohl (er)\n◦ AIL li prominenter\n◦ Rebound resistent\n◦ Poltest Griff 1 und 3 resistent (Sakrumhand =\nTesthand)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-08","slot":"ISG/SIG","nr":8,"frage":"Befund: Sacrum posterior Torsion re/li: F.T st. + Li, F.T.si ++ Li, Rebound +, Sulcus voll Re, A.I.L antero-superior Li?","antwort":"➢ nicht korrekt, Ftst + und Ftsi ++ RECHTS","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-09","slot":"ISG/SIG","nr":9,"frage":"Befund ISG-Dysfunktion Sacrum li/re über die Poltests: Griff 1: elastisch Griff 2: resistent Griff 3: elastisch Griff 4: resistent?","antwort":"• Griff 1 → resistent links\n• Griff 2 → elastisch\n• Griff 3 → resistent rechts\n• Griff 4 → elastisch\no Dysfunktion links","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-10","slot":"ISG/SIG","nr":10,"frage":"Bei einer Sacrumdysfunktion re/re gibt es eine Einschränkung der Shiftbewegung auf dem langen Pol nach antero-superior auf der linken Seite?","antwort":"• nicht korrekt, es gibt eine Shiftbewegng nach anterior-inferior d.h. Griff 2 ist resistent\n• Iliumdysfunktion nach anterior = Shiftbewegung nach postero-superior d.h. Griff 1 ist resistent","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-11","slot":"ISG/SIG","nr":11,"frage":"Die Fascia thoracolumbalis ist ein anatomische Komponente des „self-locking system“ vom Becken?","antwort":"➢ nicht korrekt, das tiefe Blatt des Fascia (MTA) setzt L1-L4 an und das hintere Blatt ist oberhalb der Muskulatur. Allerdings gibt es\neinen indirekten Kontakt über die Muskulatur und die dorsalen Sakroilicalbänder","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-12","slot":"ISG/SIG","nr":12,"frage":"Beschreibe/benenne die Funktion(-en) vom Ligamentum sacrotuberale","antwort":"• verbindet Sacrum, SIPS und Coccygeus mit dem Tuber ischiadica\n• fungiert als Propriozeption, Führung von Bewegung, Begrenzung von Bewegung\n• Kraftverteiler von WS und Becken\n• dient zur Stabilisierung vom ISG und Pelvis\n• ist wichtigster Bestandteil des „self-locking-system“\n• braucht viel Spannung um zu frunktionieren\n• verhindert, dass das Sacrum nach ventral kippt\n• über Lig. falciforme Formung vom Beckenausgang\n• bietet dem M. glutaus max. einen Ansatz\n• bis zum","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-13","slot":"ISG/SIG","nr":13,"frage":"Der M. psoas major induziert auf Höhe des ISG O eine Iliumbewegung nach anterior? O eine Iliumbewegung nach posterior? O eine Iliumbewegung nach anterior oder nach posterior?","antwort":"","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-14","slot":"ISG/SIG","nr":14,"frage":"Erkläre Self-locking System (horizontales – vertikales System), Kraft- & Formschließen","antwort":"Self-locking-system ErklärenHorizontales Self-locking-System\n• Selbstverriegelungsmechanismus für die dynamische Stabilisierung des ISGs\n• im Stand hat das Os Sakrum eine Tendenz nach anterior dadurch werden die dorsalen Bänder auf Spannung gebracht (Lig, sacroiliaca\ndorsale und interossea und Lig, sacrotuberale und falciforme)\n• Die Kräfte werden über Os ilium und Os pubis zur Symphyse geleitet → Aktion, welche die Kräfte neutralisiert und ihrerseits einen\nGegenhalt gibt → Reaktion\n• Ziel und Nutzen ist eine Stabilisierung des Beckens zusammen mit dem Relief der Gelenkflächen des ISGs\n• wenn Aktion und Reaktion gleich groß sind findet eine kleine Bewegung im ISG statt\n• wenn Aktion und Reaktion ungleich groß sind findet eine Kompression im ISG statt und es findet kaum bis keine Bewegung statt\n Vertikales Self-locking-System\n➢ Kraftübertragung zwischen Rumpf und UEX","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-15","slot":"ISG/SIG","nr":15,"frage":"Beschreibe/benenne/erkläre die Torsionsachsen nach Mitchell","antwort":"➢ Definition: die Torsionsachse wird benannt nach:\n➢ 1) Der Bewegungsrichtung der V orderseite des Os sacrum\n➢ 2) der diagonale Torsionsachse, um welche die Bewegung stattgefunden hat (re oder li)\nSacrumtorsion:\nre/reli/li Sulcus li hohl / AIL re prominentSulcus re hohl / AIL li prominent\nli/rere/liUnilaterale Flexion reUnilaterale Extension li\nSulcus li voll / AIL re weniger prominentSulcus re voll / AIL li weniger prominentSulcus re hohl / AIL re prominentSulcus li voll / AIL li weniger prominent","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-16","slot":"ISG/SIG","nr":16,"frage":"Die Sacrumtorsionen nach Mitchell (re/re, li/li, re/li, li/re) werden benannt nach: 1. Die Bewegungsrichtung der Vorderseite des Sacrums (nach li oder nach re) 2. Der longitudinale Achse um welche die Bewegung stattfindet (li oder re)?","antwort":"➢","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-17","slot":"ISG/SIG","nr":17,"frage":"Der Verlängerungstest testet die Iliosakrale Bewegung nach anterior?","antwort":"• O korrekt O nicht korrekt\n➢ Korrekt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-18","slot":"ISG/SIG","nr":18,"frage":"Folgende Strukturen sind beteiligt am „Force closure“ oder „Kraftschließen“ des Self-locking-System vom Becken: - M. levator ani - Fascia thoracolumbalis (Tiefes Blatt) - Mm. multifidi - Lig. sacrotuberale - M. transversus abdominis - Lig. falciformis","antwort":"• M. levator ani O korrekt O nicht korrekt\n• Fascia thoracolumbalis (Tiefes Blatt) O korrekt O nicht korrekt\n• Mm. multifidii O korrekt O nicht korrekt\n• Lig. sacrotuberale O korrekt O nicht korrekt\n• M. transversus abdominis O korrekt O nicht korrekt\n• Lig. falciformis O korrekt O nicht korrekt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-19","slot":"ISG/SIG","nr":19,"frage":"Sacrumdysfunktionen nach posterior sind immer primär-traumatische Dysfunktionen?","antwort":"➢ O korrekt O nicht korrekt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-20","slot":"ISG/SIG","nr":20,"frage":"Welche osteopathische (direkte/indirekte) Techniken bestehen zur Korrektur einer Ilium anterior/posterior Dysfunktion?","antwort":"• Ilium anterior\n➢ Rocking Technik (mobi)\n➢ Laxität (mobi)\n➢ Muskelenergie-Technik (MET)\n➢ Klassisch (HVLA)\n➢ Chicago (HVLA)\n• Ilium posterior\n➢ Laxität (mobi)\n➢ Muskelenergie-Technik (MET,)\n➢ Klassisch (HVLA)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-21","slot":"ISG/SIG","nr":21,"frage":"Welche osteopathische (direkte/indirekte) Techniken bestehen zur Korrektur einer Sacrum-Dysfunktion: re/re, li/li, re/li, li/re, unilat F & E?","antwort":"• Sacrum – unilaterale Extensionsdysfunktion\n• Sacrum – unilaterale Flexionsdysfunktion\n• Sacrum re/re\n• Sacrum li/li\n• Sacrum re/li\n• Sacrum li/re\n Die nächsten Fragen stehen nicht mehr im BAO Fragenkatalog","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"ISG/SIG-22","slot":"ISG/SIG","nr":22,"frage":"Übersetzung Osteokinematika in Arthrokinematika auf Höhe des SIG (Standard Gelenkform): Bilat-Sacrum Flexion Re kurzer Pol :…………………... Li kurzer Pol :……………………. Re langer Pol :…………………... Li langer Pol :………………….... Bilat. Sacrum Extension Re kurzer Pol :…………………… Li kurzer Pol :……………………. Re langer Pol :…………………... Li langer Pol :………………….... Unilat. Sacrum Flex re oder li Re kurzer Pol :…………………… Li kurzer Pol :……………………. Re langer Pol :…………………... Li langer Pol :………………….... Unilat Sacrum Ext re oder li Re kurzer Pol :…………………… Li kurzer Pol :……………………. Re langer Pol :…………………... Li langer Pol :………………….... Sacrum Li/Li Re kurzer Pol :…………………… Li kurzer Pol :……………………. Re langer Pol :…………………... Li langer Pol :………………….... Sacrum Re/Re Re kurzer Pol :…………………… Li kurzer Pol :……………………. Re langer Pol :…………………... Li langer Pol :………………….... Sacrum Li/Re Re kurzer Pol :…………………… Li kurzer Pol :……………………. Re langer Pol :…………………... Li langer Pol :………………….... Sacrum Re/Li Re kurzer Pol :…………………… Li kurzer Pol :……………………. Re langer Pol :…………………... Li langer Pol :………………….... Beschriften von bestimmten Bildern aus den Anatomie-Skripten kann als Prüfungsfrage gestellt werden","antwort":"","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-01","slot":"LWS","nr":1,"frage":"Beschreibe/erkläre/benenne: - Pediculus & Lamina arcus vertebrae (eines Lumbalwirbels) - End- bzw. Grund- und Deckplatten (eines Lumbalwirbels) - Proccesus costarius/costalis - Epiphysis anularis (eines Lumbalwirbels) - Die Trabekelsysteme (Substantia spongiosa) eines Lumbalwirbels - (Zwischen-)Wirbelgelenk (= Zygoapophysialgelenk), Facettentropismus - Übergangs- bzw. Assimilationswirbel - Lumbosakrale Übergangsvarianten bzw. Anomalien - Spondylolyse, Spondylolisthesis, Interartikularportion, lumbale Spinalkanalstenose - Die Bänder der Lendenwirbelsäule (z.B. von vorne nach hinten), den dorsalen Bandkomplex - Der Aufbau, die Ausrichtung der Fasern (& die Funktion(-en)) des Lig. longitudinale anterius, des Lig. longitudinale posterius & des Lig. interspinale (lumbales Niveau). - Der Aufbau (& Funktion) vom Lig. flavum (lumbales Niveau) - Sinus basivertebralis, Vv. basivertebrales, Batson Venenplexus - Tiefes bzw. oberflächliches Blatt der Fascia thoracolumbalis - Mm. erector trunci & kurze Wirbelsäulenmuskulatur (LWS) / der Iliolumbalen Bänder","antwort":"Pediculus arcus vertretbare = Wirbelbogenfüßchen, d.h. Es ist die Verbindung zwischen dem Wirbelkörper und \ndem Proc. Spinosi/ Transversus\nLamina arcus vertebrae = Knochenplatte\n-> beide zusammen sind der Arcus vertebrae (Wirbelbogen), auf der Lamina vertebrae sind die Fortsätze - \nProcessi, diese bilden das Foramen vertebrale\n• End- bzw Deckplatte ( eines Lumbalwirbels)\nWerden auch Substantia corticalis genannt und sind die äußere, sehr dünne kompakte Knochenschicht eines \nWirbels (unten und oben), auf den Deckplatten liegt ein hyaliner Knorpel mit Unterbrechungen auf, dient der \nVersorgung der Bandscheibe und ist daher perforiert\n• Processus costarius/ costalis\nDabei handelt es sich um Rippenreste, nicht um eine Entstehung des Proc. Transversus der HWS/BWS , daher \nwird der Querfortsatz als Proc. Costalis bezeichnet (der von L3 ist am längsten)\n• Epiphyse anularis (eines Lumbalwirbels)\nSind die verdickten Randleisten der Grund-& Deckplatte und sind ca 2mm hoch und bis zu 10 mm breit. Der \nAnulus fibrosus ist in die Außenzone eingebettet\n• Trabekelsysteme (Substantia spongiosa) eines Lumbalwirbels \nSie sind ein dreidimensionales Maschenwerk aus Knochenbälkchen (Trabekel) und sind vorwiegend vertikal und \nhorizontal ausgerichtet. ihre Anordnung und Dichte richtet sich nach den Vektoren der Druck- & Zugbelastung. \nDie Ausrichtungen der Trabekelsysteme laufen jeweils von der Deck- und Bodenplatte zu den Gelenkfortsätzen \nund zum Dornfortsatz, in den Machen der Spongiosa befindet sich das rote Knochenmark (Blutbildung)\n• Übergangs- bzw. Assimilationswirbel \nSo werden Wirbel an den Abschnittsgrenzen genannt , die Form und Charakter der angrenzenden \nWirbelregionen haben. Es kann zwischen vollständigen und partiellen Übergangswirbeln unterschieden werden \n- neigen zu Übergangsanomalien, Sacralisation L5, Hypertrophie Proc Transversus/ costarius\nLumbalisation, Sacralisation, Megatrabsversus L5, uni-/bilaterale Hypertrophie Proc. Transversus, costarius, \nSpina bifida\n• Spondylolyse, Spondylolysthesis, Inerartikularportion, lumbale Spinalkanalstenose\n-Spondylolyse= Defekt im Rahmen der ossären Verschmelzung von Wirbelbogen und -körper, meist im Bereich \nvon LWK 4 & 5 und meist bds. -> Spaltbildung in der Interartikularportion des Wirbelbogens.passiert \ntraumatisch oder während der Entwicklung (bei Neugeborenen noch nie festgestellt)\n-Spondylolysthesis = s.o. + zusätzlich Schädigung der Bandscheibe -> Wirbelgleiten \n-Interartikularportion = Zwischengelenksstück, ist der Wirbelbogenabschnitt zwischen dem unteren und oberen \nGelenkfortsatz, ist verknorpelt und nicht verknöchert, ist zusätzlich noch die Bandscheibe geschädigt, kann \neine Spondylolysthesis auftreten\n-Spina bifida = Störung während der Embryogenese, der Wirbelbogen ist hinten offen und der Proc. Spinosus \nfehlt, häufig lumbosacral\n-Lumbale Spinalkanalstenose = Verengung des Spinalkanals, dies kann zu einer Einengung oder Kompression \nder Arterien, nerven und der Dura mater führen, Leitsymptom: Claudicatio spinales mit lumbo-glutealen oder \nischialgoeformalen Schmerzen, die beim Gehen auftreten und zu einer Einschränkung der Gehstrecke führen\nBänder der Lendenwirbelsäule (von ventral nach dorsal)\n• Lig. Longitudinale anterior\n- Überzieht als breiter Streifen die Wirbelkörpervorderseiten + ventralen Anteile des Anulus fibrosus\n- Im Bereich der Konkavität von WK an dicksten ausgeprägt, strahlt in Periost ein\n- Verbindung zum Anulus fibrosus dagegen locker\n- Setzt sich aus mehreren Schichten längsverlaufender Kollagenfasern zusammen, Fasern überbrücken \njeweils 2-5 Wirbel\n- Funktion besteht in Begrenzung der Hyperextension und Hyperdistraktion\n- Kraft zum Zerreißen des Bandes ist circa doppelt so groß wie beim Lig. Longitudinale posterior\n• Lig. Longitudinale posterior\n- Läuft an Rückseite der WK entlang und bildet somit vordere Begrenzung des Wirbelkanals\n- Im Bereich der WK an oberen und unteren Rand angeheftet und schmal\n- Mit Bandscheiben fest verwachsen (Fasern strahlen seitlich in den Faserring der BS ein)\n- Tiefe Schicht weißt segmentale Gliederung auf, oberflächliche Schicht ist ein longitudinaler Strang vom \nOcciput bis L3/4 + verbindet sich über meningovertebrale Ligamente mit Dura mater spinalis\n- Funktion: Bewegungshemmung von Ventral- Lateral- und Rotationsbewegung, Entgegenwirken von \nMassenverschiebung von Bandscheibenmaterial nach dorsal + Stabiliserung Discus intervertebrale\n• Lig. Flavum\n- Verbindet segmental die Wirbelbögen\n- Besteht aus zwei in der Mittellinie voneinander getrennten Bändern\n- Verläuft von ventralen Seite der unteren Lamina zum hinteren Rand oberer Lamina\n- Bildet vorderen Teil der Gelenkkapsel der Facettengelenke\n- Besteht zu 80% aus Elastin und 20% aus Kollagen -> sehr elastisch -> bildet keine Falten bei der \nAnnäherung (Extension) -> drückt somit nicht auf RM oder Nervenwurzeln\n- Erzeugt bei Bewegung Vorspannung auf Bandscheibe und Gelenkskapsel\n• Lig. Interspinale\n- liegt im Interspinalraum\n- schräg ansteigenden Verlauf von vorne-unten nach hinten-oben -> Bewegung wird erst spät begrenzt\n- hohe propriozeptive Rolle -> Führung von Bewegung\n- eingelagerte Fettkörper verhindern knöcherne Kompression der Procc. Spinosi\n• Lig. Supraspinale\n- Verspannt die Dornfortsätze\n• Dorsaler Bandkomplex: Ligamentum supra- und infraspinale + lig. Flavum\n• tiefes und oberflächliches Blatt fascia thoracolumbalis\n• Oberflächliches Blatt\n- ausgespannt zwischen Dornfortsätzen LWS, Rippenwinkel, 12. Rippe und Darmbeinkamm + Sakrum\n- Fazien folgender Muskeln strahlen ein bzw. nutzen sie als Aponeurose:\n➢ Oberflächliche Lamina: m. gluteus maximus + medius, m. obliquus abdominis externus, m. latissimus \ndorsi\n➢ Tiefe Lamina: m. gluteus maximus, m. obliquua internus abdominis, m. serratus posterior inferior, lig. \nscrotuberale\n• Tiefes Blatt\n- Ausgehend von Lendenwirbelquerfortsätzen\n- Dient teilweise als Aponeurose für folgende Muskeln: m. latissimus dorsi, serratus posterior inferior, m. \ntransversus abdominis\n• Mm. erector trunci und kurze WS Muskulatur\n• Transversospinales System: verbindet DF mit QF übereinanderliegender Wirbel miteinander\n- Mm. Rotatores brevi et longi: tiefste, kurzfaserige Schicht -> querer Verlauf -> hohe rotatorische \nKomponente (Hauptsächlich im Bereich BWS ausgeprägt)\n• Mm. Multifidii: 2-4 Wirbel überspringend, im sakrolumbalen Bereich am kräftigsten (kommt vom \nSakrum bis Axis vor)\n• Musculi semispinalis: Fasern überspringen 5-7 Wirbel (Vorkommen m. semispinalis thoracic, \ncervicis, capitis)\n• Das Transversospinale System gehört zusammen mit den mm. Interspinales und mm. Spinales zum \nmedialen Trakt der autochthonen RM\n• Zum lateralen Trakt der autochthonen RM gehören\n- Sakrospinale System mit m. Iliocostalis und m. longissimus\n- Spinotransversale System mit m. splenius cervicis und capitis\n- Interspinale System mit mm. Intertransversarii und Mm. Levatores costarum\n• (ilio-) lumbale Bänder\n• Bestehen aus vielen Bündeln/Schichten/Überkreuzungen (superior, anterior, inferior, posterior, vertikal, \nhorizontal)\n• Gehört laut manchen Anatomen bei der Geburt zu m.quadratus lumborum (wandelt sich mit aufrechtem \nGehen zu ligamentärer Struktur um)\n• Verlauf von LWK 4+5 zu Crista iliaca und Sarkum\n• Funktion: führt und begrenzt Flex, Ex, Rot, SN (besonders von L5 auf S1), Verhindert anterior Shift \n(verhindert Listhese), Stabilisation iliolumbale Übergang, Unterstützt BS\n• Sinus basivertebrales, vv. Basivertebrales, Batson Venenplexus\n• Vv. Basivertebrales: weite, im Inneren der Wirbelkörper horizontal verlaufende, klappenlose Venen, \nwelche die WK drainieren (treten durch Foramen nutricum an der Mitte der dorsalen Wand des WK in \nden Sinus basivertebralis ein =Hohlraumsystem im WK) -> münden in Plexus venosus vertebralis \ninternus\n• Baston Venenplexus: feines Netz aus klappenlosen Venen, das von der Schädelbasis bis zum Sacrum \nin Form einer durchgehenden Anastomosenkette reicht und sich aus dem Plexus venosus vertebralis \ninternus und externus zusammensetzt","stern":false,"pruefen":false,"neu":false,"quelle":"Antworten Parietale Abschlussprüfung","kopf":"Beschreibe/erkläre/benenne","items":[{"b":"Pediculus & Lamina arcus vertebrae (eines Lumbalwirbels)","a":"- Pediculus arcus vertebrae = Wirbelbogenfüßchen\n- Lamina arcus vertebrae = Knochenplatten\n- bilden gemeinsam den Arcus vertebrae (Wirbelbogen)\n- Arcus & Wirbelkörper bilden das Foramen vertebrae, die in ihrer Gesamtheit den Canalis vertebralis bilden\n- Arcus vertebrae trägt kaum Gewichtslast, ist Ansatz der Transversi & Spinosi, bildet Proc. Articularis der Facettgelenke, dient zum\nAnsatz von Muskeln & Bändern"},{"b":"End- bzw. Grund- und Deckplatten (eines Lumbalwirbels)","a":"- Synonyme für Ober-& Unterseite des Corpus vertebrae, der Substantia corticalis (äußere, sehr dünne, kompakte Knochenschicht)\n(innere Schicht = Substantia spongiosa – schwammartige Substanz)\n- Untere & obere Substantia Corticalis heißen Endplatte bzw Grund-/ Deckplatte = Facies intervertebralis superior & inferior\n- Die Deckplatten weisen verdickte Ränder, die Randleisten = Epiphysis anularis (2 mm hoch,10 mm breit), auf\n- Den Grund - & Deckplatten liegt eine 0,1-0,6 mm dünne Hyalinknorpelplatte (hier erfolgt Diffusion von Nährstoffen) auf, die den\nKontakt zur Bandscheibe bildet"},{"b":"Proccesus costarius/costalis","a":"- „Rippenreste“, entspricht nicht den Procc. Transversi von HWS & BWS\n- Daher wird der Querfortsatz als Proc. Costalis bezeichnet\n- Entspringt dennoch am Arcus, Ansatz für Muskeln & Sehnen\n- Proc. Costarius von L3 ist der längste"},{"b":"Epiphysis anularis (eines Lumbalwirbels)","a":"- Randleisten / verdickte Ränder der Deckplatte\n- 2 mm hoch, bis zu 10 mm breit\n- Anheftung Bandscheibe ?"},{"b":"Die Trabekelsysteme (Substantia spongiosa) eines Lumbalwirbels","a":"- Corpus vertebrae besteht im Inneren aus einer schwammartigen Substanz – Substantia spongiosa\n- Diese bildet ein drei-dimensionales Maschenwerk aus Knochenbälkchen (Trabekel), diese sind vorwiegend horizontal & vertikal\nausgerichtet\n- Ihre Anordnung & Dichte richtet sich nach den Vektoren der Druck- und Zugbeanspruchung\n- Die Trabekelzüge laufen jeweils von der Deck-& Bodenplatte zu den Gelenkfortsätzen & zum Spinosi\n- In den Maschen der Wirbelkörperspongiosa befindet sich rotes Knochenmark – Aufgabe der Blutbildung\n6. (Zwischen-)Wirbelgelenk (=Zygapophysialgelenk), Facettentropismus:\n- verbinden 2 Wirbel miteinander, heften sich am Arcus an\n- im Säuglings- / Kindesalter plane Gelenkflächen, im Erwachsenenalter gebogen\n- die Facettgelenke sind in der oberen LWS eher in der Sagittalebene positioniert und wandern in den unteren Segmenten\nzunehmend in die Frontalebene\n- es kann jedoch nicht grundsätzlich von dieser Ausrichtung ausgegangen werden, eine hohe Variabilität / Individualität der\nAnatomie ist normal – diese wird als sog. „Facettentropismus“ bezeichnet\n- die oberen lumbalen Gelenkfacetten sind meist (leicht) konkav & weisen nach dorsomedial\n- die lateralen Anteile der Gelenkfläche sind sagittal & die medialen Anteile eher frontal eingestellt\n- häufig bestehen beträchtliche Formunterschiede zwischen rechtem & linken Facettengelenk = „Facettentropismus“\n \n7. übergangs- bzw Assimilationswirbel:\n- Wirbel an Abschnittsgrenzen (thorakolumbaler, lumbosakraler Übergang), die Form und Charakter der angrenzenden Wirbelregion\nhaben\n- Es kann zwischen vollständigen und partiellen Übergangswirbeln unterschieden werden"},{"b":"(Zwischen-)Wirbelgelenk (= Zygoapophysialgelenk), Facettentropismus","a":""},{"b":"Übergangs- bzw. Assimilationswirbel","a":""},{"b":"Lumbosakrale Übergangsvarianten bzw. Anomalien","a":"- Lumbalisation (komplett oder inkomplett möglich) = S 1 & S 2 nicht vollständig verknöchert – Ausbildung eines"},{"b":"Spondylolyse, Spondylolisthesis, Interartikularportion, lumbale Spinalkanalstenose","a":"- Spondylolyse: Defekt der ossären Verschmelzung zwischen Wirbelbogen und – körper – Spaltbildung in der Interartikularportion\n(Wirbelbogenabschnitt zwischen oberen und unterem Gelenkfortsatz) des Wirbelbogens – IAP nur verknorpelt, nicht verknöchert– meist L4/5, meist unilateral – Bezeichnung „angeboren“ nicht korrekt (verknöchert normalerweise erst im Wachstum), auchtraumatisch möglich\n- Spondylolisthesis (Wirbelgleiten): 50% entwickeln aus Spondylolyse ein Wirbelgleiten – hier ist zusätzlich die Bandscheibe\ngeschädigt (die Bandscheibe ist bei Spondylolyse der haltende Faktor)\n- Lumbale SKS: Verengung des Wirbelsäulenkanals, Enge im Kanal kann zu einer Kompression der Nerven, Arterien und Dura\nführen. Leitsymptom ist Claudicatio Spinalis mit lumboglutealen oder ischialgieformen Schmerzen, die beim Gehen auftretenund zu einer Einschränkung der Gehstrecke führen (im Stadium 1 reversibel durch Kyphosierung); Bei Patienten ü 65 häufigsteUrsache von Kreuzschmerzen mit/ ohne Ausstrahlung in die Beine; häufigste OP Indikation"},{"b":"Die Bänder der Lendenwirbelsäule (z.B. von vorne nach hinten), den dorsalen Bandkomplex","a":"Lendenwirbels\n- Sakralisation / Hypertrophie des Proc. Transversus von L5 = knöcherne Verbindung zwischen L5 und Sacrum ohne\ndazwischenliegende Bandscheibe ?, häufigste Anomalie, reduziert Bewegungsmöglichkeit von L5, Ausbildung einesNeogelenkes möglich, meist unilateral\n- Spina bifida occulta (benigne Form der Spina bifida) = Störung während Embryogenese, Wirbelbogen ist hinten offen, Proc\nSpinosus fehlt, häufig lumbosacral, wird nicht mit Missbildung der Meningen assoziiert, klinisch häufig asymptomatisch"},{"b":"Der Aufbau, die Ausrichtung der Fasern (& die Funktion(-en)) des Lig. longitudinale anterius, des Lig. longitudinale posterius & des Lig. interspinale (lumbales Niveau).","a":"Bänder der lumbalen WirbelsäuleLig.longitudinale posterius = verläuft an der Rückseite der Wirbelkörper entlang und bildet damit die vordere Begrenzung des Wirbelkanals.Im Bereich der Wirbelkörper ist es an deren oberen und unteren Rand angeheftet und schmal. Mit den Bandscheiben ist es fest verwachsen undseine Fasern strahlen seitlich in den Faserring der Bandscheibe ein. Das Band hemmt eine Ventral- und Lateralflexion undRotationsbewegungen. Es kann Massenverschiebungen von Bandscheibengewebe nach dorsal entgegenwirken und stabilisiert somit teilweiseden Discus verterae. Es gibt drei Anteile:1) tiefe Schicht, deren Fasern eine segmentale Gliederung aufweist.2) Die Fasern, die mit dem Anulus fibrosus eine Verbindung eingehen und sich an den Randleisten der Wirbelkörper anheften.3.) oberflächliche Schicht, deren Fasern sich als longitudinaler Strang vom Occiput bis Discus L3/4 erstrecken. Es hat zudem eine wichtigeFunktion für den Druck und die Entlastung des venösen Systems (Sinus basovertebralis), da hier der Ein- und Ausgang der betont venösenGefäße ist. Das Ligament und die Dura mater sind embryologisch ein und das gleiche Gewebe und werden somit über die gleichen Systemeversorgt.Lig.longitudinale anterius =überzieht als breiter Streifen die Wirbelkörpervorderseite und die ventralen Anteile des Anulus fibrosus. ImBereich der Konvexität der Wirbelkörper ist das Band am dicksten ausgeprägt und strahlt in das Periost ein. Die Verbindung zum Anusus istdagegen eher locker. Das vordere Längsband setzt sich aus längsverlaufenden Kollagenfasern zuammend, die in mehreren Schichten angeordnetsind. Die Fasern überbrücken 2-5 Wirbel. Das Band hemmt eine Hyperextension und Hyperdistraktion. Die notwendige Kraft um das Band zuzerreißen ist etwa doppelt so groß wie beim Lig.longitudianle posterius. Stabilisierungsfaktoren des Bandes sind die Genetik (M>F), dieAusrichtung des Bandes (parallel oder wild durcheinander), Breite des Bandes sowie die Vielzahl der zu begrenzenen Bewegungen (hier nur 1Funktion d.h. sehr stabil)Lig. flavum = kleidet den Wirbelkanal aus und ziehen ventral vom Proc. Articularis und ziehen nach dorsal zum Proc. spinosi. Es ist auf jederHöhe der Wirbesäule zu finden, jedoch nimmt die Dicke von zervikal nach lumbal zu. Die gelbliche Farbe ist der hohen Anzahl elastischerFasern geschuldet. Das Band wird bei Flexion der Wirbelsäule gedehnt und unterstützt mit seiner Rückstellkraft die Rückenmuskulatur. Esverhindert zudem ein zu großen Auseinanderkla"},{"b":"Der Aufbau (& Funktion) vom Lig. flavum (lumbales Niveau)","a":"Anatomischer Aufbau der lumbalen BandscheibenDie Bandscheibe besteht aus einem Anusus fibrosus und einem Nucleus pulposus. Der Anuslus fibrosus ist der äußere Ring der Bandscheibe, istzylinderförmig und ist in etwa 12-20 Lamellen aufgebaut. Sie bestehen zum Hauptteil aus Collegen Typ I und selten aus Collagen Typ II. Dieäußeren Lamellen sind in der Regel straffer als die inneren Lamellen, welche weniger straff und etwas ungeordneter sind. Bis zu 50% derLamellen bilden keinen geschlossenen Ring, sodass sich der Nucleus leicht aus dem Kern der Bandscheibe entfernen kann. Der Nucleuspulposus besteht aus einer zähflüssigen Masse viskösen Materials. Der Gallertkern besteht aus Collegentyp II (ungeordnet), Proteoglykanen undbei Erwachsen etwa 70% Wasser. Die hohe Wasserbindungsmöglichkeit der Proteoglykane ist verantwortliche für die hohe viskoelastischenEigenschaften der Bandscheibe. Biochemisch erlaubt die flüssige Konsistenz eine Formveränderung bei Druckeinwirkung. Durch seine Formund seine weichen, stark wasserhaltige Substanz wirkt er als Kugellager und Stoßdämpfer. Auftretenden Zug- und Druckbelastung führen zueiner dynamischen Verformung des Nucleus pulposus und werden gleichmäßig auf den Anulus fibrosus, die dazugehörigen Wirbelkörper unddie angrenzende Muskulatur übertragen. Gleichzeitig erhält das Ausdehnungsbestreben des Nucleus durch sein hohes Quellvermögen dasFasersystem des Anulus fibrosus von innen heraus unter Spannung. Die inneren Lamellen ermöglichen Bewegung und platzen ab Mitte 20langsam kaputt, was zur Folge hat, dass der Kern mehr Platz bekommt. In dem Alterungsprozess ziet sich die Versorgung peu á peu von innennach außen. Die äußeren Lamellen sind in eine Art Cris Cross-Technik angelegt, sodass sie Bewegung begrenzen können. Der Stoffwechsel unddie Bandscheibenernährung finden über Diffusionsprozesse statt, weil die Bandscheibe ab dem frühen Jugendalter nicht mehr mit Blutgefäßenversorgt wird. Nährstoffe und Wasser diffundieren über die End-/Grundplatten der Wirbelkörper und zum Teil über den Anulus fibrosus, der biszu einem Drittel weiterhin von Blutgefäßen versorgt wird.Die Ernährung ist allerdings von dem Zustand der Deck/Grundplatten abhängig, d.h.Bei Erkrankungen wie beispielsweise Mb.Bechterew oder Mb.Scheuermann ist die Versorgung der Bandscheibe schlechter. Die Nähstoffzufuhrunterliegt dem Tagesrhythmus d.h.am Tag verursacht das axiale Belasten der Bandscheibe ein Ausschwemmen der Stoffwechselentprodukteund nachts kommt es durch"},{"b":"Sinus basivertebralis, Vv. basivertebrales, Batson Venenplexus","a":"- Im Zentrum der posterioren Wand des Wirbelkörpers liegen eine bzw zwei Versorgungsöffnungen (Foramen nutricium), die vom\nhinteren Längsband bedeckt werden und den Ein- bzw Austritt von arteriellen & venösen Gefäßen (Vv. Basivertebrales) im Sinusbasivertebralis ermöglichen\n- Zwischen dem Band und der Hinterfläche der WK liegt das dicke Konvolut des Plexus venosus vertebralis internus, dessen\nvorderer Anteil mit den Vv. Basivertebrales in Verbindung steht. Der Abfluss des venösen Blutes der Wirbel erfolgt über den sog.Batson Venenplexus, einem feinen Netz von klappenlosen Venen, der sich aus dem Plexus venosus vertebralis internus undexternus zusammensetzt (von der Schädelbasis bis zum Sacrum als Anostomosenkette)."},{"b":"Tiefes bzw. oberflächliches Blatt der Fascia thoracolumbalis","a":"- Beide Blätter umschließen gemeinsam den Erector trunci & treffen sich hinter dem Quadratus lumborum\n- Beide Blätter dienen als Basisansatz für die Bauchmuskulatur\n- Oberflächliches Blatt = ausgespannt zwischen Spinosi, Rippenwinkel,"},{"b":"Mm. erector trunci & kurze Wirbelsäulenmuskulatur (LWS) / der Iliolumbalen Bänder","a":"Transversospinales System = Verbindet die einzelnen Spinosi & Transversi"}]},{"id":"LWS-02","slot":"LWS","nr":2,"frage":"Beschreibe die Form/Orientierung/Inklination der oberen/unteren lumbalen Gelenkfacetten","antwort":"- Im Säuglings- & Kindesalter plane Gelenkflächen, im Erwachsenenalter gebogen\n- In der oberen LWS sind die Facettengelenke eher in der sagittalen Ebene positioniert\n- In der unteren LWS wandern sie zunehmend in die frontale Ebene\n- Eine Variabilität in der Ausrichtung bzw allgemein in der Anatomie zwischen rechter und linker Facette sowie zwischen den\nIndividuen entspricht der Norm und wird als „Facettentropismus“ bezeichnet\n- Obere lumbale Facette = meist leicht konkav & weisen nach dorsomedial; die lateralen Anteile der Gelenkfläche sind sagittal, die\nmedialen eher frontal eingestellt\n- Inklination = Ausrichtung der Facettgelenke = obere LWS sagittal (eng) gestellt, je weiter nach unten, umso größer der Winkel\n(Richtung Frontalebene, Öffnung der Gelenkflächen)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-03","slot":"LWS","nr":3,"frage":"Beschreibe den anatomischen Aufbau der lumbalen intervertebralen Bandscheibe","antwort":"- Zylinderförmig\n- Discus intervertebralis besteht aus einem äußeren Faserring (Anulus fibrosus) und einem zentral gelegenen Gallertkern (Nucleus\npulposus)\n- Die lumbalen Bandscheiben sind ventral höher und verjüngen sich nach dorsal, somit ist die Dicke des Anulus fibrosus im\nvorderen Anteil am größten und im hinteren vergleichsweise dünn (hier kommt es eher zu Einrissen im Anulus &Bandscheibenprotrusionen).","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-04","slot":"LWS","nr":4,"frage":"Beschreibe die detaillierte Struktur des Anulus fibrosus bzw. des Nucleus pulposus (LWS)","antwort":"","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-05","slot":"LWS","nr":5,"frage":"Erkläre die Funktion(-en) der lumbalen intervertebralen Bandscheibe","antwort":"• Funktion der Bandscheibe:\n➢ Führung und Limitierung von Bewegungen in dem jeweiligen Bewegungssegment, Lastenaufnahme und -Weitergabe\nsowie Minderung von Stößen.","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-06","slot":"LWS","nr":6,"frage":"Beschreibe die Ernährung & Innervation der Bandscheibe (LWS)","antwort":"","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-07","slot":"LWS","nr":7,"frage":"Beschreibe die degenerative Veränderungen der Bandscheibe (LWS)","antwort":"","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-08","slot":"LWS","nr":8,"frage":"Eine bilaterale Spannung den thorako-lumbalen Faszien induziert eine O lumbale Flexion O lumbale Extension","antwort":"lumbale Flexion lumbale Extension\nlumabale Extension, da die thorcolumbalen Faszien einen Teil der Rumpfwand auf der Rückseite bilden.","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-09","slot":"LWS","nr":9,"frage":"Beschreibe eine L2 ERS Li Dysfunktion (Dysfunktionsmechanismus, klinische Zeichen, Tests, etc…) : NSR, FRS, L1 bis L5","antwort":"Bei einem NSR haben wir bei der Palpation der Proc.transversii mindestens 3 Proc.transversii, die auf ein und der gleichen Seite eineProminenz aufweisen. Bei der Päckchenhaltung und bei der Sphinxhaltung gibt es hierbei keine Veränderungen oder nur sehr geringe.\n Bei einem FRS L2 rechts haben wir eine deutliche Prominenz des Proc.transversi auf der rechten Seite auf Höhe von L2. In Päckchenhaltungverschwindet die Prominenz und in der Sphinxhaltung verschlechtert sich d.h. Sie wird deutlicher, die Prominenz. V oraussetzung ist auch hierwieder, dass nur ein Segment eine Dysfunktion hat.\n Bei zwei Abweichungen kann man die Definierung nach Mitchell nicht nutzen. Man sollte sich dann nochmal beide Wirbel in dem jeweiligenTest anschauen evtl. steht ein Wirbel in der Dysfunktionsrichtung beim Palpieren, aber kann sich noch frei bewegen!!\n 47. bei einer FRS Dysfunktion (eines LWK) hat dieser Wirbel eine Einschränkung der Konvergenz auf der linken SeiteKorrekte Aussage, da bei einer FRS-Dysfunktion die Divergenz gut funktioniert (Päckchenhaltung würde die Prominenz auflösen) und dieKonvergenz würde nicht gut gehen (Sphinxhaltung verstärkt die Prominenz)\n 48. welche Information(-en) bekommt man über den Lumbar-roll Test?\n• Über den Lumbar-roll Test (LRT) untersucht man betont die lumbalen intervertebralen bzw. segmentalen Rotationsmöglichkeiten\n• Trichtermodell:\n➢ 1) oberer Trichter = reine Rotaion\n➢ 2) mittlerer Trichter = Rotation + Kompression\n➢ 3) die eigentliche Testbewegung: unterer Trichter bzw. Löchlein = reine Kompression","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-10","slot":"LWS","nr":10,"frage":"Bei einer FRS Li Dysfunktion (eines Lumbalwirbels) hat dieser Wirbel eine Einschränkung der Konvergenz auf der linken Seite","antwort":"- Nicht korrekt! Einschränkung der Konvergenz / Konvergenzhemmung auf der RECHTEN Seite.","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-11","slot":"LWS","nr":11,"frage":"Welche Information(-en) bekommt man über den Lumbar-roll Test?","antwort":"- Lumbale intervertebrale bzw segmentale Rotationsmöglichkeit\n- Es ist möglich, einen Bewegungsverlust zwischen 2 Lumbalwirbeln festzustellen.\nErgänzungen?","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-12","slot":"LWS","nr":12,"frage":"Beschreibe die Bewegungsprinzipien nach Fryette für die LWS","antwort":"Benenne/beschreibe die Dysfunktionsmodelle nach Fryette von C2-3 bis C6-7\n- Erstes Gesetz\n➢ In neutraler Position wird ein Wirbel bei einer Seitneigung in eine Richtung in die andere Richtung rotieren\n➢ Z.B. Seitneigung links lässt der Wirbel nach rechts rotieren\n- Zweites Gesetz\n➢ Wenn ein Wirbel sich in einer Flexion oder Extension befindet, wird die Rotation in die gleiche Richtung wie die\nSeitneigung erfolgen.\n➢ Z.B. In Flexion wird eine Rotation rechts verbunden sein mit einer Seitneigung rechts\n- Drittes Gesetz\n➢ In einem Wirbelsegment wird jede Bewegung in einer Ebene die Bewegungen in den anderen Ebenen\nbeeinflussen\n➢ Z.B. In Extension vermindert sich die Rotation und Lateralflexion eines Wirbels.\n- V on C2-C7 gilt nur das","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-13","slot":"LWS","nr":13,"frage":"Welche Info(-s) bekommt man über den Rebound-Test (auf Höhe TH12-L1 bis L5-S1)","antwort":"- Informationen über Spannung bzw Elastizität der LWS insgesamt bzw Sacrum (S1) und auch der einzelnen Segmente\n- Schmerzhaftigkeit / Druckempfindlichkeit\n- Über Extensionsfähigkeit der einzelnen Wirbel / Sacrum und das „Zurückfedern“\n- Über Flexionsfähigkeit\n- Eventuell ist eine Resistenz in einem einzelnen Segment gegenüber den anderen Segmenten spürbar\n- Gibt einen Eindruck über die allgemeine Gewebespannung des Patienten\nErgänzungen?","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-14","slot":"LWS","nr":14,"frage":"Beschreibe die Bewegungen des Lumbalwirbels im 3-dimensionalen Koordinatensystem","antwort":"Koordinatensystem\n- Flexion – Extension: - Rotation um die X\nAchse; - Translation entlang der ZAchse\n- Lateralflexion: - Rotation um die Z\nAchse; - Translation entlang der XAchse\n- Axiale Rotation: - Rotation um die Y\nAchse; - Translation entlang der YAchse","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-15","slot":"LWS","nr":15,"frage":"Übersetzung Osteokinematika in Arthrokinematika auf Höhe der LWS: LWS-Flexion/Extension: LWS-Lateralflexion re/li: LWS-Rotation re/li","antwort":"LWS Flexion = Ventralflexion = Facettäre Divergenz\n- Procc. Articulares des oberen Wirbels verlagern sich nach cranial & ventral\n- Nucleus pulposus versetzt sich fast nicht\n- Anulus fibrosus wird an der V orderseite komprimiert, an der Hinterseite gedehnt\n- Dorsale Kapselstruktur & dorsale Bänder werden gedehnt\n- Während Ventralflexion befindet sich die Belastung des Knorpels auf dem cranialen Anteil der Facetten\n- Bewegung wird gebremst durch: apophyseale Gelenke (Apposition der Facetten & Spannung der Kapselstrukturen), Discus,\nposteriore Bänder & Muskeln (Erector spinae)\nLWS Extension = Dorsalflexion = Facettäre Konvergenz\n- Facies articulares inferiores des oberen Wirbels verlagern sich nach caudal und dorsal\n- Nucleus pulposus versetzt sich fast nicht\n- Anulus fibrosus wird gedehnt an der V orderseite, komprimiert an der Hinterseite\n- Auch bei Dorsalflexion werden Ligg. Interspinalia gedehnt\n- Bewegung wird hauptsächlich gebremst durch Kontakt der Gelenkflächen\nLWS Lateralflexion = Sidebending\n- Facies articularis an der konvexen Seite bewegt sich nach cranial-ventral, die der konkaven Seite nach caudal – dorsal\n- Nucleus zeigt eine Deformierung, aber fast keine Verlagerung\n- Anulus fibrosus wird komprimiert an der konkaven Seite, gedehnt an der konvexen\n- Beide Kapseln spannen sich an\n- An der konvexen Seite spannen sich Ligg. Intertransversaria & Ligg Flava an\n- Bewegung wird gebremst durch Ligamente und Knochenkontakt (in Dorsalflexion ist es möglich, dass eine Lateralflexion durch\nknöcherne Elemente gebremst wird)\nLWS Rotation = axiale Rotation\n- Rotation ist auf Höhe der lumbalen Wirbelsäule sehr eingeschränkt durch die räumliche Orientierung der apophysären\nGelenkfacetten\n- In Ventralflexion ist die Rotationsmöglichkeit größer, da der Raum zwischen den Gelenkflächen größer ist. In Ventralflexion kann\ndie Rotation der gesamten lumbalen WS zwischen 15 & 25 Grad betragen.\n- Die axiale Rotation ist auch abhängig von der Höhe des Discus. Mehr Höhe = mehr Raum zwischen Facetten = mehr\nRotationsmöglichkeit\nBegleitbewegungen\n- Lateralflex ist mit axialer Rotation gekoppelt\n- Proc articularis inferior verlagert sich nach oben (ventral) an der konvexen Seite & nach unten (dorsal) an der konkaven\n- Zusammen mit asymmetrischer Spannung in den intertransversalen Bändern & dem Discus entsteht eine rotatorische Bewegung\num eine longitudinale Achse (Y Achse)\n- Bei der LWS mit normaler Lendenlordose wird eine Lateralflexion zu einer Seite von einer Rotation zu entgegengesetzten Seite\nbegleitet (=heterolaterale oder positive axiale Rotation)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-16","slot":"LWS","nr":16,"frage":"Beschreibe die Charakteristiken einer (lumbalen) Type I-Dysfunktion/ Type II- Dysfunktion","antwort":"Type I Dysfunktionen:\n- NSR\n- Sidebending & Rotation gegensätzlich\n- Plurisegmental\n- Sekundäre Dysfunktion, kompensatorisch für: parietale, viszerale, craniosacrale Dysfunktionen,…etc\n- Graduell (nicht sofort)\nType II Dysfunktionen:\n- FRS oder ERS\n- Rotation = Sidebending\n- Monosegmental\n- Primäre, traumatische DF\n- Plötzlich, abrupt","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"LWS-17","slot":"LWS","nr":17,"frage":"Beschreibe die funktionelle Bedeutung der LWS für das Abdomen (und/oder vice versa) Beschriften von bestimmten Bildern aus den Anatomie-Skripten kann als Prüfungsfrage gestellt werden","antwort":"• Stabilisiert den Bauch (u.a. über M.transversus abdominis)\n• bildet Teile der Bauchpresse (M.Iliopsoas und M.quadratus lumborum)\n• bildet einen Ansatz für das Diaphragma\n• hat Einwirkung auf die inneren Organe (Wand-Inhalt)\n LWSBeschreibe, Erkläre, Benenne:","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-01","slot":"BWS","nr":1,"frage":"Beschreibe den Corpus vertebrae eines Brustwirbels. Beschreibe die Unterschiede zum Corpus vertebrae eines Halswirbels","antwort":"vertebrae eines Halswirbels\n- WK BWS dreieckig + dicker (als HWS) LWS = massiver + queroval\n- Wirbellöcher kleiner (als HWS) LWS = noch kleiner\n- Fovae costales für Rippen\n- Orientierung der Facettengelenke 60° nach oben + 20°nach außen (HWS = dorsocranial, LWS = fast medial + dorsal)\n- Proc. Spinosi = dachziegelartig nach unten (HWS = gedoppelt, LWS = rund + breit)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-02","slot":"BWS","nr":2,"frage":"Beschreibe die räumliche Orientierung der (oberen/unteren) Gelenkfacetten in der BWS","antwort":"- 60°nach oben gerichtet (Sagitalebene) + 20°nach außen gerichtet (Transversalebene)\n- Obere Gelenkfacette = nach oben, hinten + außen gerichtet\n- Untere Gelenkfacette = nach unten, vorne + innen gerichtet","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-03","slot":"BWS","nr":3,"frage":"Welche der Wirbel(n) von Th 1 bis Th 12 besitzen keine Gelenkflächen auf den Processi transversi?","antwort":"- Th 11+ Th12\n- Für die Artikulation mit dem Rippen-Höckerchen ist jeder Querfortsatz nach dorsal abgedrängt und besitzt eine Gelenkfläche\nAusnahmen nur Th11+Th12","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-04","slot":"BWS","nr":4,"frage":"Benenne/beschreibe die unterschiedlichen Gelenkverbindungen zwischen den Rippen und den Brustwirbeln","antwort":"Brustwirbeln\n- Da die Rippenköpfchen mit den dorsalen Bereichen je zweier aneinander angrenzenden Wirbelkörper artikulieren, hat jeder\nWirbelkörper oben + unten eine halbe Gelenkfläche (Fovea costalis superior + inferior).\n- Ausnahmen sind Th1 = komplette obere + halbe untere Gelenkfäche, Th11 + Th12 = 1 komplette Gelenkfläche","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-05","slot":"BWS","nr":5,"frage":"Wie steht(-en) die 1., 11., 12. Rippe gelenkig mit der BWS in Verbindung?","antwort":"5. Wie steht(-en) die 1., 11., \n12. Rippe gelenkig mit der BWS in Verbindung?\n- \n1. Rippe:\n➢ Komplette Gelenkfläche oben + halbe Gelenkfläche am Wirbelkörper + ein kompletter Ansatz an Proc.\nTransversi\n- \n11. Rippe + \n12. Rippe:\n➢ Jeweils eine komplette Gelenkfläche am Wirbelkörper (wie \n1. Rippe am cranialen Rand des WK)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-06","slot":"BWS","nr":6,"frage":"Benenne/Beschreibe die knöchernen Bestandteile/Gelenkverbindungen der Apertura thoracis superior","antwort":"Superior\n- Herzförmige Öffnung von oben betrachtet\n- Entsteht durch WK Th1 +","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-07","slot":"BWS","nr":7,"frage":"Benenne den Inhalt der oberen Thoraxapertur","antwort":"- Trachea\n- Ösophagus\n- Gefäße (A. carotis communis, A. subclavia, Truncus, V .\njugularis interna, V . subclavia\n- Lymphknoten\n- Ductus thoracicus\n- Oberseite Lunge (Lungenspitze)\n- Nerven (N. vagus, N. phrenicus, N. laryngeus, Truncus\nsympatikus)","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer rkante der entsprechenden Rippe","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-12","slot":"BWS","nr":12,"frage":"Wie wird die Haut im Bereich der Brust- und Bauchwand sensibel versorgt?","antwort":"- Erfolgt über N. intercostalis\n- Intercostalraum zum jeweiligen Raum\n- Ab Th7 parallel zur Rippe weiter\n- Th10 = BN\n- Th12 = oberhalb Pubis","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-13","slot":"BWS","nr":13,"frage":"Beschreibe die arterielle Versorgung/den venösen Abfluss der BWS & der Thoraxwand","antwort":"Arteriell: Venös:\n- An der Hinterseite der Aorta treten auf jeder Segmenthöhe\njeweilis eine Arterie re + li aus\nà A. intercostalis posterior\nà Versorgt Haut / WK / Muskulatur\n- A. thoracica interna kommt aus A. subclavia\nà steigen dann jeweils parallel zum Sternum ab\n- A. intercostalis anterior zieht von A. thoracicus interna\n(Ursprung) entlang der Rippen nach hinten in die A.intercostalis posterior\n- A. spinalis anterior versorgt Rm + zusätzliche Anastomosen\nvon anderen Arterien à insgesamt viele Anastomosen àgute Versorgung\n- V . intercostalis superior + V . subcostalis\nà V . azygos + V . hemiazygos + V . hemiazygos accessoria\nà 1) Vena cava superior\n2) V . lumbalis ascendens à V . cava inferior (unterhalb)\n3) V . brachiocephalica à V . cava superior\n-\nPlexus venosus vertebralis externus post. + ant. + Plexusvenosus vertebralis internus post. + ant.","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-14","slot":"BWS","nr":14,"frage":"Aus welchen Hirnnerven entsteht das kraniale parasympathische System?","antwort":"- N. occulomotorius\n- N. facialis\n- N. glossopharyngeus\n- N. vagus","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-15","slot":"BWS","nr":15,"frage":"Was ist die Rolle/Funktion vom Nervus vagus im vegetativen System?","antwort":"- Der N. vagus (10) ist der größte parasympathische Nerv und gehört somit zum vegetativen NS\n- Er versorgt im Brust und Bauchbereich: Speiseröhre, Magen, Leber, Gallenblase, Bauchspeicheldrüse, Dünndarm und Teile des\nDickdarms und hat verdauungsfördernde Effekte\n- Er wirkt dämpfend/beruhigend auf Herz und Lunge\n- Hemmt den sympaticus","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-16","slot":"BWS","nr":16,"frage":"Beschreibe den Unterschied in der Lage zwischen den Proc. spinosi & den Proc. transversi auf Höhe der BWS","antwort":"auf Höhe der BWS\n- Proc. Spinosi:\n➢ Th 1,2,3,12 = horizontal\n➢ Th 4,5,6,11 = Proc. Spinosi verläuft schräg\n➢ Th 7,8,9,10 = Proc. Spinosi verläuft schräg bis zum nächsten unteren Wirbel (endet auf Höhe Proc. Transversi des\nnächsten Wirbels)\n- Proc. Transversi:\n➢ Parallel zum WK\n➢ V on Th1 bis mitte BWS vergrößern sich die Proc. Transveri\n➢ Ab Mitte BWS nach caudal werden proc. Transversi kleiner\n➢ Besitzen Fovea costalis, außer Th11 + 12","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-17","slot":"BWS","nr":17,"frage":"Auf welchem Wirbelniveau der BWS befindet sich der Angulus inferior der Scapula & die Spina scapulae des Patienten im Sitzen?","antwort":"scapulae des Patienten im Sitzen?\n- Angulus inferior: à Th7\n- Spina scapulae: à Th3","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-18","slot":"BWS","nr":18,"frage":"Auf welchem Wirbelniveau befindet sich der Angulus sterni?","antwort":"scapulae des Patienten im Sitzen?\n- Angulus inferior: à Th7\n- Spina scapulae: à Th3","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-19","slot":"BWS","nr":19,"frage":"Beschreibe die Bewegung(-en) der Gelenkfacetten und die limitierenden (oder begrenzenden) Strukturen (Faktoren) bei einer Flexion/Extension/Lateralflexion/Rotation der BWS","antwort":"Strukturen (Faktoren) bei einer Flexion/Extension/Lateralflexion/Rotation der BWS\n- Latflex:\n➢ Während einer Latflex gleiten die Facetten des oberen Wirbels auf der Seite der konvexität nach oben (=Divergenz) und\nauf der Seite der Konkavität gleiten die Facetten des oberen Wirbels nach unten (=Konvergenz)\n➢ Limitierung: Spannung Lig. Flavum, Ligg. Intertransversarii auf konvexer Seite, Konvergenzbewegung und\nRippenkontakt auf der konkaven Seite\n- Rotation:\n➢ Bei einer Rotation nach links gleiten die beiden unteren Gelenkfacetten des oberen Wirbels nach rechts = laterales Gleiten\n➢ Limitierung segmentale Rotation: Rippen-Sternum-komplex + Lig. Flavum + Gelenkkapsel \n- Flex:\n➢ Bei Flexion gleiten die unteren Gelenkfacetten vom oberen Wirbel nach anterior + superior (=Divergenz)\n➢ Limitierung der segmentalen Flexion: Spannung der Lig. Interspinosum, Lig. Flavum, Gelenkkapsel + Lig. Longitudinale\nposterius\n- Ext:\n➢ Bei der Extension gleiten die unteren Gelenkfacetten vom oberen Wirbel nach caudal (=Konvergenz)\n➢ Limitierung: Spannung Lig. Longitudinale anterius, Proc. Spinosi, endgradig Gelenkfacetten","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-20","slot":"BWS","nr":20,"frage":"Definiere eine “Gelenkblockierung”. Über welches Endgefühl beim arthrokinematischen Testen der BWS kommt man zu diesem Befund?","antwort":"der BWS kommt man zu diesem Befund?\n- Gelenkblockierung = reversible , hypomobile segmentale Dysfunktion mit eingeschränkten oder fehlenden Gelenkspiel\n- Beim arthrokinematischen test fällt eine hart-fest-elastische Resistenz auf","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-21","slot":"BWS","nr":21,"frage":"Beschreibe die Endgefühle die man beim arthrokinematischen Testen d sind geschützt durch Wirbelkörper à Nerv liegt dahinter und nicht auf Höhe der BS\nà neurologische Ausfälle/Probleme gering","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-30","slot":"BWS","nr":30,"frage":"Benenne 3 Pathologien, die BWS-Beschwerden verursachen können","antwort":"- Artikulär degenerativ:\n➢ Arthrose Facetten, costovertebral, costotransversal\n➢ degenerative BS-Erkrankung\n- Knochen:\n➢ Osteoporose, Rippenprellung\n➢ Rippen #, Wirbel #\n- Neurologische Störung:\n➢ RM-Bereich z.B. SKS\n➢ Foramen vertebrale z.B. Radikulitis (Schädigung Nervenwurzel)\n➢ Plexus brachialis, periphere Nerven\n- Athritis\n- Tumorös\n- Reflektorische Ausstrahlschmerzen z.B. Herz, Lunge, Magen, Leber…\n- Skoliose\n- Mb. Scheuermann","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-31","slot":"BWS","nr":31,"frage":"Benenne 3 Stellen, wo der Plexus brachialis komprimiert werden kann","antwort":"- Zwischen scaleni (hintere Scalenuslücke)\n- Zwischen","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-32","slot":"BWS","nr":32,"frage":"Erkläre die Schmerzen im oberen rechten BWS-Bereich (oder rechten Schulterbereich) bei einer Cholezystitis!","antwort":"Cholezystitis!\n- N. phrenicus versorgt u.a. die Gallenblase à bei Problemen meldet N. phrenicus ans Gehirn „verwirrt“ woher so eine Information\nkommt à Reflektiert wird diese Information auf Segment C3/C4/C5\n- Somit kann es zu Schmerzen in der re HSG oder in der BWS kommen à reflektorischer Ausstrahlungsschmerz\n- Wichtig folgende Fragen zu stellen (DD):\n➢ Schmerzen re Oberbauch?\n➢ Schmerzen nach fetthaltigem Essen?\n➢ Übelkeit?\n➢ Völlegefühl?\n➢ Dunkelfärbung vom Stuhl?\n➢ Hellgefärbter Stuhl?","stern":false,"pruefen":false,"neu":true,"quelle":"Abschlussprüfung Parietale (neuer Antwortkatalog)"},{"id":"BWS-33","slot":"BWS","nr":33,"frage":"Erkläre/beschreibe/benenne: - Angulus infrasternalis - Fovea costalis inferior/ superior - das Verhältnis von Processi spinosi & Processi transversi auf Höhe der BWS - Hühnerbrust, Trichterbrust, Fassthorax, Glockenthorax - die zervikale Rippe oder Halsrippe - die ligamentären Verbindungen des Brustwirbels - die ligamentären Verbindungen des Brustwirbels mit der Rippe - die autochthone Rückenmuskulatur (auf Höhe der BWS) - das transversospinale System & das spinotransversale System. - den Nervus subcostalis - den Brustsympathikus - ‘Tietze Syndrom’ (Definition, Ursache)","antwort":"• Angulus infrasternalis = der Winkel der am caudalen Ende des Brustbeins von den zusammenlaufenden Rippenknorpeln gebildet wird - ca 90° • Fovea costalis inferior / superior= da die Rippenköpfchen mit den dorsalen Bereichen je zweier aneinander angrenzenden Wirbelkörper artikulieren, har jeder WK oben und unten jeweils eine halbe Gelenkfläche • Verhältnis Procc spinosi , Procc Transversi auf Höhe BWS TH1,2,3 & 12 Proc. Spinosus = horizontal TH4,5,6 & 11 Proc. Spinosus = schräg TH 7,8,9,10 Proc. Spinosus = schräg bis zum nächsten unteren Wirbel (Höhe Proc. Transversus) • Hünerbrust: keilförmige Vorwölbung des Sternums • Trichterbrust: angeborene oder erworbene Einziehung der vorderen Brustwand • Fassthorax: kurzer, breiter, fassförmiger Thorax, der in Inspir steht • Glockenthorax: glockenartige Verformung in unteren Bereichen, weit gestellter Thorax (z.B. Rachitis, Vit\u0002D Mangel, Ca-Mangel) • Halsrippe, cervikale Rippe= Assimilationsstörung in Form von rippentragenden Halswirbelkörpern, meist an C7, Halsrippen sind oft nur stummelartig ausgebildet & knorpelig oder bindegewebig mit Sternum verwachsen, kommen bei 0,27% vor & nur 10% sind symptomatisch • Ligamentäre Verbindungen des Brustwirbels: Lig, interspinale, Lig. Supraspinale, Ligg, Flava, Ligg. Intertransversarium,Lig. Costotransversarium, Lig Capitis costalis Radiator • autochthone Rückenmuskulatur M. Iliocostalis lum","stern":false,"pruefen":false,"neu":false,"quelle":"Antworten Parietale Abschlussprüfung","kopf":"Erkläre/beschreibe/benenne","items":[{"b":"Angulus infrasternalis","a":"- Winkel, der am caudalen Ende des Brustbeins von den zusammenlaufenden Rippenknorpel gebildet wird\n- Abhängig vom Konstitutionstyp à Norm ca. 30°"},{"b":"Fovea costalis inferior/ superior","a":"- Inferior:\n➢ Kleine + caudal gelegene Gelenkflächen an ventraler Seite der BWK´s, artikuliert mit oberen Facette des caput costa\n➢ Bildet einen Teil des Rippen-Wirbel-Gelenkes\n- Superior:\n➢ Kleine + cranial gelegne Gelenkfläche an ventraler Seite der BWK´s, artikuliert mit caput costae\n➢ Bildet Teil des Rippen-Wirbel-Gelenk\n \n3. das Verhältnis von Processi spinosi & Processi transversi auf Höhe der BWS\n- Proc. Spinosi:\n➢ Th 1,2,3,12 = horizontal\n➢ Th 4,5,6,11 = Proc. Spinosi verläuft schräg\n➢ Th 7,8,9,10 = Proc. Spinosi verläuft schräg bis zum nächsten unteren Wirbel (endet auf Höhe Proc. Transversi des\nnächsten Wirbels)\n- Proc. Transversi:\n➢ Parallel zum WK\n➢ V on Th1 bis mitte BWS vergrößern sich die Proc. Transveri\n➢ Ab Mitte BWS nach caudal werden proc. Transversi kleiner\n➢ Besitzen Fovea costalis, außer Th11 + 12"},{"b":"das Verhältnis von Processi spinosi & Processi transversi auf Höhe der BWS","a":"Bei Lateralflexion des Kopfes wandern die Processi Spinosi (C2-C6) in Richtung\nX der Konvexität 0 der Konkavität"},{"b":"Hühnerbrust, Trichterbrust, Fassthorax, Glockenthorax","a":"- Hühnerbrust:\n➢ Kielförmig V orwölbung des Brustbeins, durch zu viel Wachstum\n- Trichterburst:\n➢ Kongenitale (angeborene) oder erworbene Einziehung der vorderen Brustwand Häufigkeit ca. 0,5%, geringfügig\nhäufiger beim Jungen, durch zu wenig Wachstum\n- Fassthorax:\n➢ Einen kurzen, breiten faßförmigen Brustkorb, der in der Inspirationsstellung\nfixiert ist – Lungenproblemen = Lungenemphysem\n- Glockenthorax:\n➢ Glockenartige Verformung des Brustkorbes. In seinen unteren Bereichen weit gestellter Brustkorb, z.B. bei Rachitis\n \n5. die zervikale Rippe oder Halsrippe\n- zusätzliche Rippe die am HWK 7 ansetzt\n- Die Halsrippe ist eine Assimilationsstörung im Bereich des CTÜ\n- Sind stummelartig ausgebildet und knorpelig oder bindegewebig mit dem Sternum verbunden\n- Kommt nur bei 0,27% der gesunden Bevölkerung vor, 10% von ihnen sind symptomatisch \n \n6. die ligamentären Verbindungen des Brustwirbels + Rippen\n Brustwirbelverbindung Rippenverbindung\n- Lig. Longitudinale anterius + posterius\n- Lig. Flavum\n- Lig. Supraspinale + infraspinale\n- Lig. Intertransversarium\n- Gelenkkapsel\n- Lig. Costotransversum lat/med/superius\n- Lig. Capitis costae radiatum\n- Lig. Capitis costae intra-articulare\n \n \n7. die autochthone Rückenmuskulatur (auf Höhe der BWS)\n- M. longissimus\n- M. splenius\n- M. spinalis\n- M. semispinalis\n- Mm. Rotatores breves u. longi\n- Mm. levatores costarum\n- M. multifidius\n \n \n \n \n \n \n \n \n8. das transversospinale System & das spinotransversale System\n- transversospinales System:\n➔ M. rotatores thoracis (1-2 Segmente) proc. Transveri à proc. Spinales\n➔ M. levatores costarum (proc transversum + Rippe unten)\n➔ M. mulifidus (2-4 Segmente)\n➔ M. semispinales\n➔ Aufgaben: Stabilisierung des Bewegungssegment; bei beidseitiger Kontraktion entlasten alle\nMuskeln die Bandscheibe + komprimieren die Facettengelenke\n- Spinotransversales System:\n➔ Diese Muskeln ziehen von Dornfortsätzen zu den Querfortsätzen proximaler Wirbel\n➔ Mm. Splenii cervicis + capitis + Mm. obbliquus capitis inferior\n➔ Aufgabe: Kopf halten\n9. den Nervus subcostalis\n- ist der anteriore Ast des"},{"b":"die zervikale Rippe oder Halsrippe","a":"- zusätzliche Rippe die am HWK 7 ansetzt\n- Die Halsrippe ist eine Assimilationsstörung im Bereich des CTÜ\n- Sind stummelartig ausgebildet und knorpelig oder bindegewebig mit dem Sternum verbunden\n- Kommt nur bei 0,27% der gesunden Bevölkerung vor, 10% von ihnen sind symptomatisch"},{"b":"die ligamentären Verbindungen des Brustwirbels","a":"Brustwirbelverbindung Rippenverbindung\n- Lig. Longitudinale anterius + posterius\n- Lig. Flavum\n- Lig. Supraspinale + infraspinale\n- Lig. Intertransversarium\n- Gelenkkapsel\n- Lig. Costotransversum lat/med/superius\n- Lig. Capitis costae radiatum\n- Lig. Capitis costae intra-articulare"},{"b":"die ligamentären Verbindungen des Brustwirbels mit der Rippe","a":"Brustwirbelverbindung Rippenverbindung\n- Lig. Longitudinale anterius + posterius\n- Lig. Flavum\n- Lig. Supraspinale + infraspinale\n- Lig. Intertransversarium\n- Gelenkkapsel\n- Lig. Costotransversum lat/med/superius\n- Lig. Capitis costae radiatum\n- Lig. Capitis costae intra-articulare"},{"b":"die autochthone Rückenmuskulatur (auf Höhe der BWS)","a":"- M. longissimus\n- M. splenius\n- M. spinalis\n- M. semispinalis\n- Mm. Rotatores breves u. longi\n- Mm. levatores costarum\n- M. multifidius"},{"b":"das transversospinale System & das spinotransversale System.","a":"- Das spinotransversale Muskelsystem (nur an der oberen BWS und HWS) besteht aus dem Mm. Splenii cervicalis und\ncapitis\n- Sie ziehen von Procc. Spinosi zu Procc. Transversari höherer Wirbel (mm. Splenii cervicalis) oder zum Proc. Mastoideus\ndes Os temporale sowie zur Linea nuchalis superior des Os occipitale (Mm. Splenii capitits)\n- Diese Muskeln werden aus den Rückenästen (rami posteriores bzw. dorsales) der Spinalnerven innerviert"},{"b":"den Nervus subcostalis","a":"Beschreibe den Nervus intercostalis (Anatomie, Verlauf,…)\n- Entspricht dem vorderen Ast (Ramus anterior) des jeweiligen Spinalnerven im BWS-Bereich\n- Anzahl entspricht der Zahl der Rippenzwischenräume à 11 pro Seite bis 12 Rippenpaaren\n- Der letzte unterhalb der 12 Rippe = N. subcostalis\n- Funktion: motrisch Zwischenrippenmm. + Bauchmm + Haut im Brust und oberen Bauchwand\n- Parallel zum Nern läuft eine Arterie und eine Vene an der Unterkante der entsprechenden Rippe"},{"b":"den Brustsympathikus","a":"- im Grenzstrang ventral der Rippenköpfchen unter Pleura costalis\n- Beeinflussungsmöglichkeiten durch Atmung + Rippendysfunktion + vertebraler Bereich\n- Grenzstrang enthält 12 Ganglien. Ganglien sind über Rr. Interganglionares mit einander verbunden und über Rr.\nCommunicans mit dem Spinalnerv\n- Oberstes Ganglion meist mit Ganglion cervicale inferius verbinden (3 Hals-Ganglion) à Ganglion Stellatum\n- Aus Ganglion 5-11 entspringen Nn. Splanchnici major minor à präganglionäre Neurone laufen zu Verschaltzentren an der\nAorta"},{"b":"‘Tietze Syndrom’ (Definition, Ursache)","a":"- seltene idiopathische Chondropathie der Rippenknorpel am Ansatz des Sternum\n- gehen mit Schmerzen und Schwellung im Bereich des ventralen Thorax einher\n- Ursache unbekannt, eventuell Entzündung durch Überreizung\n- Häufig werden Blockierungen der zugehörigen Costo-vertebralgelenke gefunden\n- Jeder der 7 Rippenknorpelansätze am Brustbein kann betroffen sein. In 90% der Fälle verursachen mehrere Ansätze\nBeschwerden. Am häufigsten befällt das Tietze-Syndrom den 2-5 Rippenknorpel"}]},{"id":"Rippen-01","slot":"Rippen","nr":1,"frage":"Beschreibe die rotatorische Bewegung (AM/PL) des rechten und linken Caput costae bei einer Lateralflexion rechts/passiven Rotation rechts/aktiven Rotation rechts!","antwort":"Aktive Thoraxrotation (z. B. nach links): Die linke Thoraxhälfte macht eine antero-mediale Rotation (A1-Achse), die rechte gleichzeitig eine postero-laterale Rotation (A2). Die Wirbelsäule macht im ersten Moment eine Kontrarotation nach rechts (B-Achse), am Ende dreht Thorax + WS global nach links (intramediastinale Achse C). — Passive Rotation (weiterlaufend aus HWS/LWS, z. B. Kopf dreht nach rechts): die Rippen der rechten Thoraxhälfte gehen in Posteriorität → PL, Angulus costae rechts prominent.","stern":true,"pruefen":true,"neu":false,"quelle":"Rotationsdysfunktionen der Rippen (Tabletversion), S5–6"},{"id":"Rippen-02","slot":"Rippen","nr":2,"frage":"Beschreibe Anatomie/Verlauf/Funktion… der Mm. intercostales externe/interni!","antwort":"Mm.
